<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convertidor de Imágenes</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    :root { --azul-marino: #003366; }
    body { background-color:#ffffff; color:#1a1a2e; display:flex; flex-direction:column; min-height:100vh; }
    .card-custom {
      border-radius: 8px;
      border: none;
      border-left: 5px solid var(--azul-marino);
      transition: transform 0.2s;
    }
    .card-custom:hover { transform: translateY(-5px); }

    .image-preview {
      min-height: 160px;
      border: 2px dashed #dee2e6;
      border-radius: 8px;
      background-color: #fafbfc;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .image-preview.has-image { border: 1px solid var(--azul-marino); }
    .preview-icon { font-size: 2.5rem; color: #adb5bd; }
    .btn-outline-marino {
      border: 2px solid var(--azul-marino);
      color: var(--azul-marino);
      font-weight: 600;
    }
    .btn-outline-marino:hover { background-color: var(--azul-marino); color: white; }
  </style>
</head>
<body>
  <div id="header-container"></div>

  <!-- col-md-9 offset para dejar espacio al sidebar en desktop -->
  <main class="flex-grow-1 col-md-9 ms-md-auto col-lg-10 py-5 px-4">
    <div class="container">
      
      <header class="mb-4 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3">
        <div>
          <h2 class="fw-bold" style="color: var(--azul-marino);">Convertidor de Imágenes</h2>
          <p class="text-muted mb-0">Gestión de archivos INE y Fotos de Perfil.</p>
        </div>
        <div>
          <button class="btn btn-outline-marino" onclick="location.reload()">
            <i class="bi bi-arrow-clockwise me-2"></i>Recargar
          </button>
        </div>
      </header>

      <!-- Nueva sección para el Folio -->
      <div class="row mb-4">
        <div class="col-12 col-md-6 col-xl-4">
          <label for="folioInput" class="form-label small fw-bold" style="color: var(--azul-marino);">Coloque el nombre de Folio (opcional)</label>
          <input type="text" id="folioInput" class="form-control" placeholder="Ej. 105952">
        </div>
      </div>

      <div class="row g-4">
        <div class="col-12 col-xl-7">
          <div class="card card-custom p-4 h-100 shadow-sm">
            <h5 class="fw-bold mb-3"><i class="bi bi-card-heading me-2"></i>Combinar INE (1300x400)</h5>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label small fw-bold">FRENTE</label>
                <input type="file" id="ineFrontalInput" class="form-control" accept="image/*">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label small fw-bold">REVERSO</label>
                <input type="file" id="ineLateralInput" class="form-control" accept="image/*">
              </div>
            </div>

            <div class="image-preview mb-3" id="ineCombinedPreview">
              <div class="text-center" id="inePlaceholder">
                <i class="bi bi-id-card preview-icon"></i>
                <p class="small text-muted mb-0">Vista previa combinada</p>
              </div>
            </div>

            <button id="downloadIneBtn" class="btn btn-outline-marino w-100 d-none shadow-sm">
              <i class="bi bi-cloud-upload me-2"></i>Subir INE a Drive
            </button>
            <div id="ineStatus" class="mt-2 text-center small"></div>
          </div>
        </div>

        <div class="col-12 col-xl-5">
          <div class="card card-custom p-4 h-100 shadow-sm">
            <h5 class="fw-bold mb-3"><i class="bi bi-person-bounding-box me-2"></i>Selfie (265x320)</h5>
            <div class="mb-3">
              <label class="form-label small fw-bold">SUBIR IMAGEN</label>
              <input type="file" id="selfieInput" class="form-control" accept="image/*">
            </div>

            <div class="image-preview mb-3" id="selfiePreview" style="min-height: 200px;">
              <div class="text-center" id="selfiePlaceholder">
                <i class="bi bi-person-square preview-icon"></i>
                <p class="small text-muted mb-0">Vista previa selfie</p>
              </div>
            </div>

            <button id="downloadSelfieBtn" class="btn btn-outline-marino w-100 d-none shadow-sm">
              <i class="bi bi-cloud-upload me-2"></i>Subir Selfie a Drive
            </button>
            <div id="selfieStatus" class="mt-2 text-center small"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsrender@1.0.14/jsrender.min.js"></script>
  <script src="js/app.js"></script>

<script>
    // URL desplegada de Google Apps Script
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbygqhpJct88ZhbtH6tnfkPys3vgggJiVLyjufqJ-Pz9bSLcvM1ohYS4sVgAFe8Al3ed/exec";

    let ineFrontalImage = null;
    let ineLateralImage = null;
    let currentIneDataUrl = null;
    let currentSelfieDataUrl = null;

    // Función para obtener el folio ingresado o el valor por defecto
    function getFolioName() {
      let folio = $("#folioInput").val().trim();
      return folio !== "" ? folio : "folio";
    }

    $("#folioInput").on("input", function() {
      getFolioName();
    });

    function handleImageLoad(file, callback) {
      const reader = new FileReader();
      reader.onload = e => {
        const img = new Image();
        img.onload = () => callback(img);
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function setPreview(containerId, placeholderId, dataUrl) {
      const el = document.getElementById(containerId);
      const ph = document.getElementById(placeholderId);
      el.style.backgroundImage = `url('${dataUrl}')`;
      if (ph) ph.style.display = 'none';
      el.classList.add('has-image');
    }

    function combineIneImages() {
      if (!ineFrontalImage || !ineLateralImage) return;

      const canvas = document.createElement('canvas');
      canvas.width = 1300;
      canvas.height = 400;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, 1300, 400);

      ctx.drawImage(ineFrontalImage, 0, 0, 650, 400);
      ctx.drawImage(ineLateralImage, 650, 0, 650, 400);

      currentIneDataUrl = canvas.toDataURL('image/jpeg', 0.90);
      setPreview('ineCombinedPreview', 'inePlaceholder', currentIneDataUrl);

      // Si vuelve a generar la imagen, se habilita el botón con su estado inicial
      $("#downloadIneBtn")
        .removeClass("d-none btn-success")
        .addClass("btn-outline-marino")
        .prop("disabled", false)
        .html('<i class="bi bi-cloud-upload me-2"></i>Subir INE a Drive');
      $("#ineStatus").empty();
    }

    $("#ineFrontalInput").on("change", function(e) {
      const file = e.target.files[0];
      if (file) handleImageLoad(file, img => { ineFrontalImage = img; combineIneImages(); });
    });

    $("#ineLateralInput").on("change", function(e) {
      const file = e.target.files[0];
      if (file) handleImageLoad(file, img => { ineLateralImage = img; combineIneImages(); });
    });

    $("#selfieInput").on("change", function(e) {
      const file = e.target.files[0];
      if (!file) return;
      handleImageLoad(file, img => {
        const canvas = document.createElement('canvas');
        canvas.width = 265;
        canvas.height = 320;
        canvas.getContext('2d').drawImage(img, 0, 0, 265, 320);

        currentSelfieDataUrl = canvas.toDataURL('image/jpeg', 0.90);
        setPreview('selfiePreview', 'selfiePlaceholder', currentSelfieDataUrl);

        // Si vuelve a cargar selfie, se habilita el botón con su estado inicial
        $("#downloadSelfieBtn")
          .removeClass("d-none btn-success")
          .addClass("btn-outline-marino")
          .prop("disabled", false)
          .html('<i class="bi bi-cloud-upload me-2"></i>Subir Selfie a Drive');
        $("#selfieStatus").empty();
      });
    });

    // Función unificada para enviar imágenes a Google Apps Script
    function uploadToDrive(dataUrl, fileName, btnId, statusId) {
      const $btn = $(btnId);
      const $status = $(statusId);

      if (!dataUrl) {
        $status.html('<span class="text-danger">No hay imagen generada para subir.</span>');
        return;
      }

      const rawBase64 = dataUrl.split(',')[1];
      const payload = {
        base64: rawBase64,
        mimeType: "image/jpeg",
        fileName: fileName
      };

      // Bloquear botón durante el envío y mostrar spinner
      $btn.prop("disabled", true).html('<span class="spinner-border spinner-border-sm me-2"></span>Subiendo...');
      $status.html('<span class="text-info">Enviando archivo a Google Drive...</span>');

      fetch(GOOGLE_SCRIPT_URL, {
        method: "POST",
        headers: {
          "Content-Type": "text/plain;charset=utf-8"
        },
        body: JSON.stringify(payload)
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          // Éxito: Bloqueo permanente del botón y cambio de texto a "Archivo subido"
          $btn.prop("disabled", true)
              .removeClass("btn-outline-marino")
              .addClass("btn-success")
              .html('<i class="bi bi-check-circle-fill me-2"></i>Archivo subido');

          $status.html(`<span class="text-success fw-bold"><i class="bi bi-check-circle me-1"></i>¡Subido con éxito! <a href="${data.fileUrl}" target="_blank">Ver en Drive</a></span>`);
        } else {
          throw new Error(data.message || "Error desconocido en el servidor");
        }
      })
      .catch(err => {
        console.error(err);
        $status.html(`<span class="text-danger fw-bold"><i class="bi bi-exclamation-triangle me-1"></i>Error al subir: ${err.message || "No se pudo conectar"}. Intente de nuevo.</span>`);

        // Error: Bloqueo temporal de 5 segundos antes de reorientar el botón para reintentar
        let countdown = 5;
        $btn.prop("disabled", true).html(`<i class="bi bi-clock me-2"></i>Espere (${countdown}s)...`);
        
        const timer = setInterval(() => {
          countdown--;
          if (countdown > 0) {
            $btn.html(`<i class="bi bi-clock me-2"></i>Espere (${countdown}s)...`);
          } else {
            clearInterval(timer);
            $btn.prop("disabled", false).html('<i class="bi bi-arrow-counterclockwise me-2"></i>Reintentar subida');
          }
        }, 1000);
      });
    }

    // Eventos de clic para subir imágenes
    $("#downloadIneBtn").on("click", function(e) {
      e.preventDefault();
      const fileName = getFolioName() + "-ine.jpg";
      uploadToDrive(currentIneDataUrl, fileName, "#downloadIneBtn", "#ineStatus");
    });

    $("#downloadSelfieBtn").on("click", function(e) {
      e.preventDefault();
      const fileName = getFolioName() + "-foto.jpg";
      uploadToDrive(currentSelfieDataUrl, fileName, "#downloadSelfieBtn", "#selfieStatus");
    });
  </script>
</body>
</html>
