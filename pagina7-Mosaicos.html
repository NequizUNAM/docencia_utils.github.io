  <!-- =========================================================
       JAVASCRIPT — PÁGINA 7
       MOSAICOS SDCP
       ========================================================= -->

  <script>


    /* =========================================================
       CONFIGURACIÓN
       ========================================================= */


    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyM785Mm5p9PyTz8aQuxrcR1q3wRrUDHtAVuk9M4k_avfNY2FJSwUeDFRrt2EjRugv-6A/exec";


    /*
       Número máximo de imágenes que se procesan
       simultáneamente.
    */

    const CONCURRENCIA_SUBIDA = 4;



    /* =========================================================
       ESTADO
       ========================================================= */


    let imagenesSeleccionadas = [];

    let subiendo = false;



    /* =========================================================
       ATAJO PARA ELEMENTOS
       ========================================================= */


    const $ = (id) =>
      document.getElementById(id);



    /* =========================================================
       FECHA
       ========================================================= */


    function partesFecha(fecha) {

      return {

        dia:
          String(fecha.getDate())
            .padStart(2, "0"),

        mes:
          String(fecha.getMonth() + 1)
            .padStart(2, "0"),

        anio:
          String(fecha.getFullYear())

      };

    }



    /* =========================================================
       LISTAR ARCHIVOS EXISTENTES EN DRIVE
       ========================================================= */


    async function listarArchivosEnCarpeta({
      curso,
      anio,
      mes,
      dia
    }) {


      const qs =
        new URLSearchParams({

          accion: "listar",

          curso,

          anio,

          mes,

          dia

        });


      const resp =
        await fetch(
          `${APPS_SCRIPT_URL}?${qs.toString()}`
        );


      if (!resp.ok) {

        throw new Error(
          `No se pudo consultar Drive ` +
          `(HTTP ${resp.status})`
        );

      }


      const data =
        await resp.json();


      if (!data.ok) {

        throw new Error(
          data.error ||
          "Error al listar archivos existentes"
        );

      }


      return data.files;

    }



    /* =========================================================
       OBTENER ÚLTIMA CAPTURA
       
       AHORA ACEPTA CUALQUIER EXTENSIÓN
       ========================================================= */


    function obtenerUltimaCaptura(
      nombres,
      curso,
      grupo,
      turno
    ) {


      const prefijo =
        `${curso}_${grupo}_${turno}_Captura_`;


      /*
         Antes solamente buscábamos .png.

         Ahora:

         .png
         .jpg
         .jpeg
         .webp
         .gif
         .bmp
         .svg
         .tiff
         .avif
         etc.
      */


      const patron =
        new RegExp(

          `^${prefijo.replace(
            /[.*+?^${}()|[\]\\]/g,
            "\\$&"
          )}(\\d+)_[12]\\.[^.]+$`,

          "i"

        );


      let maximo = 0;


      for (const nombre of nombres) {

        const m =
          nombre.match(patron);


        if (m) {

          maximo =
            Math.max(
              maximo,
              parseInt(m[1], 10)
            );

        }

      }


      return maximo;

    }



    /* =========================================================
       BLOB A BASE64
       ========================================================= */


    function blobABase64(blob) {

      return new Promise(
        (resolve, reject) => {


          const lector =
            new FileReader();


          lector.onload =
            () => {

              resolve(
                lector.result
                  .split(",")[1]
              );

            };


          lector.onerror =
            reject;


          lector.readAsDataURL(blob);

        }
      );

    }



    /* =========================================================
       OBTENER EXTENSIÓN ORIGINAL
       ========================================================= */


    function obtenerExtension(
      nombreArchivo
    ) {


      const partes =
        nombreArchivo.split(".");


      if (partes.length < 2) {

        return "img";

      }


      return partes
        .pop()
        .toLowerCase();

    }



    /* =========================================================
       CARGAR IMAGEN
       ========================================================= */


    async function cargarImagen(
      blob,
      nombreFinal,
      {
        curso,
        anio,
        mes,
        dia
      }
    ) {


      const contenidoBase64 =
        await blobABase64(blob);


      const resp =
        await fetch(
          APPS_SCRIPT_URL,
          {

            method: "POST",

            headers: {

              "Content-Type":
                "text/plain;charset=utf-8"

            },

            body:
              JSON.stringify({

                curso,

                anio,

                mes,

                dia,

                nombre:
                  nombreFinal,

                contenidoBase64

              })

          }
        );


      if (!resp.ok) {

        throw new Error(
          `Fallo de red al subir ` +
          `${nombreFinal} ` +
          `(HTTP ${resp.status})`
        );

      }


      return resp.json();

    }



    /* =========================================================
       VALIDAR FORMULARIO
       ========================================================= */


    function formularioValido() {


      const curso =
        $("curso").value;


      const grupo =
        $("grupo").value;


      const turno =
        document.querySelector(
          'input[name="turno"]:checked'
        );


      return (
        curso &&
        grupo &&
        turno
      );

    }



    /* =========================================================
       AGRUPAR IMÁGENES

       Dos imágenes = una captura.
       ========================================================= */


    function agruparImagenes(
      archivos
    ) {


      const capturas = [];


      for (
        let i = 0;
        i < archivos.length;
        i += 2
      ) {


        capturas.push([

          archivos[i],

          archivos[i + 1] || null

        ]);

      }


      return capturas;

    }



    /* =========================================================
       VALIDAR ARCHIVOS

       IMPORTANTE:

       YA NO SE RESTRINGE A PNG.

       Solamente se acepta un archivo
       cuyo tipo MIME corresponda a una imagen.

       image/png
       image/jpeg
       image/webp
       image/gif
       image/bmp
       image/svg+xml
       image/tiff
       image/avif
       etc.
       ========================================================= */


    function validarArchivos(
      archivos
    ) {


      return archivos.filter(
        f => {

          return (
            !f.type ||
            !f.type.startsWith("image/")
          );

        }
      );

    }



    /* =========================================================
       AGREGAR IMÁGENES
       ========================================================= */


    function agregarImagenes(
      nuevosArchivos
    ) {


      const invalidos =
        validarArchivos(
          nuevosArchivos
        );


      const avisoFormato =
        $("avisoFormato");


      if (invalidos.length > 0) {


        avisoFormato.textContent =

          `Estos archivos no son imágenes ` +
          `válidas y no fueron agregados: ` +
          `${invalidos
            .map(f => f.name)
            .join(", ")}`;


        avisoFormato
          .classList
          .remove("d-none");

      }
      else {


        avisoFormato
          .classList
          .add("d-none");

      }


      const validos =
        nuevosArchivos.filter(
          f =>
            !invalidos.includes(f)
        );


      /*
         IMPORTANTE:

         No sustituimos las imágenes
         anteriores.

         Las nuevas se agregan al final.
      */

      imagenesSeleccionadas =
        imagenesSeleccionadas.concat(
          validos
        );


      $("mensajeFinal")
        .classList
        .add("d-none");


      mostrarVistaPrevia();


      revisarBotonSubir();

    }



    /* =========================================================
       INPUT DE ARCHIVOS
       ========================================================= */


    $("inputImagenes")
      .addEventListener(
        "change",
        (e) => {


          agregarImagenes(
            Array.from(
              e.target.files
            )
          );


          /*
             Permite seleccionar nuevamente
             el mismo archivo.
          */

          e.target.value = "";

        }
      );



    /* =========================================================
       DRAG & DROP
       ========================================================= */


    const dropzone =
      $("dropzone");


    [
      "dragenter",
      "dragover"
    ]
    .forEach(
      evt => {

        dropzone.addEventListener(
          evt,
          (e) => {

            e.preventDefault();

            dropzone.classList.add(
              "dragover"
            );

          }
        );

      }
    );


    [
      "dragleave",
      "drop"
    ]
    .forEach(
      evt => {

        dropzone.addEventListener(
          evt,
          (e) => {

            e.preventDefault();

            dropzone.classList.remove(
              "dragover"
            );

          }
        );

      }
    );


    dropzone.addEventListener(
      "drop",
      (e) => {


        const archivos =
          Array.from(
            e.dataTransfer.files || []
          );


        if (archivos.length) {

          agregarImagenes(
            archivos
          );

        }

      }
    );



    /* =========================================================
       LIMPIAR SELECCIÓN
       ========================================================= */


    $("btnLimpiar")
      .addEventListener(
        "click",
        () => {


          imagenesSeleccionadas =
            [];


          $("mensajeFinal")
            .classList
            .add("d-none");


          $("progresoBox")
            .classList
            .add("d-none");


          $("avisoFormato")
            .classList
            .add("d-none");


          mostrarVistaPrevia();


          revisarBotonSubir();

        }
      );



    /* =========================================================
       VISTA PREVIA
       ========================================================= */


    function mostrarVistaPrevia() {


      const cont =
        $("listaCapturas");


      cont.innerHTML = "";


      const capturas =
        agruparImagenes(
          imagenesSeleccionadas
        );


      capturas.forEach(
        (par, idx) => {


          const col =
            document.createElement(
              "div"
            );


          col.className =
            "col";


          const completa =
            par[1] !== null;


          const urlImagen1 =
            URL.createObjectURL(
              par[0]
            );


          const urlImagen2 =
            completa
              ? URL.createObjectURL(
                  par[1]
                )
              : null;


          col.innerHTML = `

            <div class="captura-card card border">


              <div class="captura-header">

                <span>

                  Captura ${idx + 1}

                </span>


                <i
                  class="bi bi-clock-history estado-icono pendiente"
                  data-captura="${idx}"
                ></i>

              </div>


              <div class="captura-thumbs">


                <img
                  class="${completa ? "" : "unica"}"
                  src="${urlImagen1}"
                  alt="Imagen 1"
                >


                ${
                  completa

                    ? `

                      <img
                        src="${urlImagen2}"
                        alt="Imagen 2"
                      >

                    `

                    : ""
                }


              </div>


            </div>

          `;


          cont.appendChild(
            col
          );

        }
      );

    }



    /* =========================================================
       EVENTOS DEL FORMULARIO
       ========================================================= */


    [
      "curso",
      "grupo"
    ]
    .forEach(
      id => {

        $(id).addEventListener(
          "change",
          revisarBotonSubir
        );

      }
    );


    document
      .querySelectorAll(
        'input[name="turno"]'
      )
      .forEach(
        radio => {

          radio.addEventListener(
            "change",
            revisarBotonSubir
          );

        }
      );



    /* =========================================================
       REVISAR BOTÓN SUBIR
       ========================================================= */


    function revisarBotonSubir() {


      const btn =
        $("btnSubir");


      const invalidosPresentes =
        !$("avisoFormato")
          .classList
          .contains("d-none");


      btn.disabled =

        subiendo ||

        !formularioValido() ||

        imagenesSeleccionadas.length === 0 ||

        invalidosPresentes;

    }



    /* =========================================================
       ACTUALIZAR ICONO DE CAPTURA
       ========================================================= */


    function actualizarIconoCaptura(
      idx,
      estado
    ) {


      const icono =
        document.querySelector(
          `i[data-captura="${idx}"]`
        );


      if (!icono) return;


      icono.className =

        `bi ${
          estado === "ok"

            ? "bi-check-circle-fill"

            : estado === "error"

              ? "bi-x-circle-fill"

              : "bi-arrow-repeat"

        } estado-icono ${estado}`;

    }



    /* =========================================================
       SUBIDA CON CONCURRENCIA
       ========================================================= */


    async function subirConConcurrencia(
      tareas,
      concurrencia,
      onResultado
    ) {


      let cursor = 0;


      async function trabajador() {


        while (
          cursor <
          tareas.length
        ) {


          const tarea =
            tareas[cursor++];


          try {


            const resultado =
              await cargarImagen(
                tarea.blob,
                tarea.nombreFinal,
                tarea.ruta
              );


            onResultado(
              tarea,
              resultado.ok,
              resultado.ok
                ? null
                : resultado.error
            );

          }


          catch (err) {


            onResultado(
              tarea,
              false,
              err.message
            );

          }

        }

      }


      const trabajadores =
        Array.from(
          {
            length:
              Math.min(
                concurrencia,
                tareas.length
              )
          },
          trabajador
        );


      await Promise.all(
        trabajadores
      );

    }



    /* =========================================================
       BOTÓN CARGAR IMÁGENES
       ========================================================= */


    $("btnSubir")
      .addEventListener(
        "click",
        async () => {


          if (subiendo) return;


          subiendo = true;


          revisarBotonSubir();


          $("btnSubir").innerHTML = `

            <span
              class="spinner-border spinner-border-sm me-1"
            ></span>

            Cargando...

          `;


          $("mensajeFinal")
            .classList
            .add("d-none");



          /* ===================================================
             DATOS DEL FORMULARIO
             =================================================== */


          const curso =
            $("curso").value;


          const grupo =
            $("grupo").value;


          const turno =
            document.querySelector(
              'input[name="turno"]:checked'
            ).value;


          const {
            dia,
            mes,
            anio
          } =
            partesFecha(
              new Date()
            );


          const ruta = {

            curso,

            anio,

            mes,

            dia

          };



          /* ===================================================
             AGRUPAR CAPTURAS
             =================================================== */


          const capturas =
            agruparImagenes(
              imagenesSeleccionadas
            );


          const total =
            imagenesSeleccionadas.length;



          /* ===================================================
             PROGRESO
             =================================================== */


          const progresoBox =
            $("progresoBox");


          const barra =
            $("barraProgreso");


          progresoBox
            .classList
            .remove("d-none");


          barra.style.width =
            "0%";



          try {


            /* ================================================
               1. CONSULTAR DRIVE
               ================================================ */


            const archivosExistentes =
              await listarArchivosEnCarpeta(
                ruta
              );


            /*
               Calculamos el último número
               de captura utilizado.

               No importa la extensión.
            */


            let numeroCaptura =
              obtenerUltimaCaptura(
                archivosExistentes,
                curso,
                grupo,
                turno
              );



            /* ================================================
               2. PREPARAR TODAS LAS TAREAS
               ================================================ */


            const tareas = [];


            const numeroPorCaptura =
              [];


            capturas.forEach(
              (par) => {


                numeroCaptura += 1;


                numeroPorCaptura.push(
                  numeroCaptura
                );


                [
                  [1, par[0]],
                  [2, par[1]]
                ]
                .forEach(
                  ([orden, img]) => {


                    if (!img) return;


                    /*
                       Conservamos la extensión
                       original.
                    */


                    const extension =
                      obtenerExtension(
                        img.name
                      );


                    tareas.push({

                      capturaIdx:
                        numeroPorCaptura.length - 1,


                      nombreFinal:

                        `${curso}_${grupo}_${turno}_Captura_${numeroCaptura}_${orden}.${extension}`,


                      blob:
                        img,


                      ruta

                    });

                  }
                );

              }
            );



            /* ================================================
               3. ICONOS EN ESTADO SUBIENDO
               ================================================ */


            tareas.forEach(
              t => {

                actualizarIconoCaptura(
                  t.capturaIdx,
                  "subiendo"
                );

              }
            );



            /* ================================================
               4. VARIABLES
               ================================================ */


            let completadas = 0;

            let exitosas = 0;


            const capturasConError =
              new Set();



            /* ================================================
               5. SUBIR
               ================================================ */


            await subirConConcurrencia(

              tareas,

              CONCURRENCIA_SUBIDA,

              (
                tarea,
                ok,
                error
              ) => {


                completadas++;


                if (ok) {

                  exitosas++;

                }
                else {


                  capturasConError.add(
                    tarea.capturaIdx
                  );


                  console.error(
                    `Error en ${tarea.nombreFinal}:`,
                    error
                  );

                }


                const pct =
                  Math.round(
                    (
                      completadas /
                      tareas.length
                    ) * 100
                  );


                barra.style.width =
                  pct + "%";

              }

            );



            /* ================================================
               6. ACTUALIZAR ICONOS
               ================================================ */


            numeroPorCaptura.forEach(
              (_, idx) => {


                actualizarIconoCaptura(

                  idx,

                  capturasConError.has(
                    idx
                  )

                    ? "error"

                    : "ok"

                );

              }
            );



            /* ================================================
               7. MENSAJE FINAL
               ================================================ */


            const mensajeFinal =
              $("mensajeFinal");


            mensajeFinal.className =

              `alert py-2 ${
                capturasConError.size > 0
                  ? "alert-warning"
                  : "alert-success"
              }`;


            mensajeFinal.textContent =

              capturasConError.size > 0

                ? `Imágenes cargadas: ${exitosas} de ${total}. ` +
                  `Hubo errores en ${capturasConError.size} captura(s); ` +
                  `vuelve a intentar con esas imágenes.`

                : `Imágenes cargadas: ${exitosas}.`;


            mensajeFinal
              .classList
              .remove("d-none");



            /* ================================================
               8. LIMPIAR SELECCIÓN
               ================================================ */


            imagenesSeleccionadas = [];


            mostrarVistaPrevia();

          }


          catch (errGeneral) {


            const mensajeFinal =
              $("mensajeFinal");


            mensajeFinal.className =
              "alert alert-danger py-2";


            mensajeFinal.textContent =

              `Error durante la carga: ` +
              `${errGeneral.message}`;


            mensajeFinal
              .classList
              .remove("d-none");

          }


          finally {


            subiendo = false;


            $("btnSubir").innerHTML = `

              <i class="bi bi-upload me-1"></i>

              Cargar imágenes

            `;


            revisarBotonSubir();

          }

        }
      );



    /* =========================================================
       ESTADO INICIAL
       ========================================================= */


    revisarBotonSubir();


  </script>


</body>

</html>
