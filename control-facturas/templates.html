<!--
  =====================================================================
  CONTROL DE FACTURAS · PLANTILLAS (JsRender)
  ---------------------------------------------------------------------
  Aquí viven TODAS las pantallas de la app. Cada plantilla es un
  <script type="text/x-jsrender" id="NOMBRE"> que app.js descarga una
  vez, compila y dibuja con  R('NOMBRE', datos).

  Sintaxis JsRender usada:
    {{>texto}}        imprime texto escapado (seguro para datos del usuario)
    {{:html}}         imprime HTML tal cual (sólo para HTML generado por la app)
    {{if x}}…{{else}}…{{/if}}     condiciones
    {{for lista}}…{{else}}…{{/for}}   ciclos ({{else}} = lista vacía)
    {{for lista tmpl="otra"/}}   dibuja otra plantilla por cada elemento
    #data             el elemento actual dentro de un {{for}}
    ~money() ~fecha() ~periodo() ~icon()   ayudantes definidos en app.js

  Secciones:
    1. Comunes       estructura, menú, modales, archivos, ajustes, visor
    2. Facturas      lista, tarjeta y formulario de factura
    3. Saldos        saldos a favor por declaración y sus usos
    4. Mensuales     declaraciones mensuales
    5. Anuales       declaraciones anuales

  ⚠ Si editas este archivo, sube CONFIG.VERSION en app.js para que los
    navegadores no usen una copia vieja guardada en caché.
  =====================================================================
-->


<!-- =================================================================
     1. COMUNES
     ================================================================= -->

<!-- Estructura general: barra superior, contenedor de la vista y navegación inferior.
     Datos: { title, icon, syncLabel, fab, nav:[{key,icon,label,active}] } -->
<script type="text/x-jsrender" id="shell">
<header class="topbar">
  <button class="icon-btn" id="menuBtn" aria-label="Menú">{{:~icon('menu')}}</button>
  <h1><span class="chip-ico">{{:~icon(icon)}}</span><span class="ttl">{{>title}}</span></h1>
  <button class="btn gold sm topbtn" id="datosBtn" title="Datos para facturar a la UNAM">{{:~icon('copy')}}<span>Datos para facturar</span></button>
  {{if ro}}
    <button class="icon-btn" id="reloadBtn" aria-label="Actualizar" title="Actualizar datos del panel">{{:~icon('refresh')}}</button>
  {{else}}
    <!-- Interruptor: usar o no tus datos de CONFIG al precargar -->
    <label class="pf-toggle" title="Desactivar prellenado (tus datos: RFC, nombre, receptor)">
      <input type="checkbox" id="prefillTg" {{if prefill}}checked{{/if}}><span class="sw" aria-hidden="true"></span><span class="t">Prellenado</span>
    </label>
    <button class="icon-btn" id="shareBtn" aria-label="Compartir solo lectura" title="Compartir solo lectura">{{:~icon('share')}}</button>
  {{/if}}
  <div class="sync ok {{if ro}}ro-pill{{/if}}" id="sync"><span class="dot"></span><span class="lbl">{{>syncLabel}}</span></div>
  <button class="icon-btn" id="lockBtn" aria-label="Bloquear" title="Bloquear">{{:~icon('lock')}}</button>
</header>
<main id="view"></main>
{{if fab}}<button class="fab" id="fab" aria-label="Agregar">{{:~icon('plus')}}</button>{{/if}}
<nav class="bottomnav">
  {{for nav}}<a href="#/{{:key}}" class="{{if active}}active{{/if}}">{{:~icon(icon)}}<span>{{>label}}</span></a>{{/for}}
</nav>
</script>

<!-- Menú lateral (☰). Los ejercicios anuales se muestran como lista desplegable.
     Datos: { appName, view, years:[], driveLink } -->
<script type="text/x-jsrender" id="drawer">
<div class="drawer-bg"></div>
<nav class="drawer">
  <h2>{{>appName}}</h2>
  <a href="#/facturas" class="{{if view=='facturas'}}active{{/if}}">{{:~icon('file')}} Facturas</a>
  <a href="#/saldos" class="{{if view=='saldos'}}active{{/if}}">{{:~icon('coin')}} Saldos a favor</a>
  <a href="#/gastos" class="{{if view=='gastos'}}active{{/if}}">{{:~icon('receipt')}} Control de gastos</a>
  <a href="#/banco" class="{{if view=='banco'}}active{{/if}}">{{:~icon('bank')}} Banco</a>
  <a href="#/mensuales" class="{{if view=='mensuales'}}active{{/if}}">{{:~icon('cal')}} Declaraciones mensuales</a>
  <details {{if view=='anuales'}}open{{/if}}>
    <summary>{{:~icon('archive')}} Declaraciones anuales {{:~icon('chev')}}</summary>
    {{for years}}<a href="#/anuales/{{:#data}}">Ejercicio {{:#data}}</a>{{/for}}
    <a href="#/anuales/nuevo">+ Agregar ejercicio</a>
  </details>
  <hr>
  <button class="d-item" id="dReg">{{:~icon('scale')}} Regímenes fiscales (consulta)</button>
  <button class="d-item" id="dSet">{{:~icon('gear')}} Ajustes y respaldos</button>
  {{if driveLink}}<a href="{{>driveLink}}" target="_blank" rel="noopener">{{:~icon('drive')}} Abrir carpeta en Drive</a>{{/if}}
  <button class="d-item" id="dLock">{{:~icon('lock')}} Bloquear</button>
</nav>
</script>

<!-- Ventana modal genérica. body y footer llegan como HTML ya dibujado por otras plantillas.
     Datos: { title, size:''|'wide'|'full', body, footer } -->
<script type="text/x-jsrender" id="modal">
<div class="modal {{>size}}" role="dialog" aria-modal="true" aria-label="{{>title}}">
  <header class="modal-h"><h2>{{>title}}</h2><button class="icon-btn" data-close aria-label="Cerrar">{{:~icon('x')}}</button></header>
  <div class="modal-b">{{:body}}</div>
  {{if footer}}<footer class="modal-f">{{:footer}}</footer>{{/if}}
</div>
</script>

<!-- Diálogo de confirmación. Datos: { msg } / { ok, danger } -->
<script type="text/x-jsrender" id="confirm-body">
<p style="margin:0">{{>msg}}</p>
</script>
<script type="text/x-jsrender" id="confirm-footer">
<button class="btn" data-close>Cancelar</button>
<button class="btn {{if danger}}danger{{else}}primary{{/if}}" data-ok>{{>ok}}</button>
</script>

<!-- Pie simple: Cancelar + botón principal. Datos: { id, label } -->
<script type="text/x-jsrender" id="footer-ok">
<button class="btn" data-close>Cancelar</button>
<button class="btn primary" id="{{:id}}">{{>label}}</button>
</script>

<!-- Renglón de un archivo (PDF/XML) con botones Ver / Subir / Cambiar / Quitar.
     Los botones llevan data-act y app.js decide qué hacer.
     Datos: ver slotVM() en app.js -->
<script type="text/x-jsrender" id="slot">
<div class="slot {{:cls}}" data-slot="{{:key}}">
  <div class="ico {{:icoCls}}">{{>extLabel}}</div>
  <div class="info">
    <b>{{>label}}</b>
    <span>{{>sub}}</span>
    {{if note}}<em class="slot-note">{{>note}}</em>{{/if}}
  </div>
  <div class="acts">
    {{if canView}}<button type="button" class="btn sm" data-act="view">Ver</button>{{/if}}
    {{if extra}}<button type="button" class="btn sm" data-act="{{:extra.act}}">{{>extra.label}}</button>{{/if}}
    {{if removed}}
      <button type="button" class="btn sm" data-act="undo">Deshacer</button>
    {{else}}
      <button type="button" class="btn sm {{if !hasFile}}primary{{/if}}" data-act="pick">{{if hasFile}}Cambiar{{else}}Subir{{/if}}</button>
    {{/if}}
    {{if canRemove}}<button type="button" class="icon-btn mini" data-act="remove" aria-label="Quitar">{{:~icon('x')}}</button>{{/if}}
  </div>
</div>
</script>

<!-- Lista de renglones de archivo. Datos: { slots:[slotVM] } -->
<script type="text/x-jsrender" id="slots">
{{for slots tmpl="slot"/}}
</script>

<!-- Primera vez: elegir dónde guardar -->
<script type="text/x-jsrender" id="setup">
<main><div class="setup">
  <h2>¿Dónde guardamos tus documentos?</h2>
  <p class="muted" style="margin:0">Puedes cambiarlo después en Ajustes.</p>
  <div class="sheet-opts">
    <button class="sheet-opt" data-m="drive"><div class="ic">{{:~icon('drive')}}</div><div><b>Google Drive (recomendado)</b><span>Tus PDF y XML en una carpeta de tu Drive. Disponible en cualquier dispositivo.</span></div></button>
    <button class="sheet-opt" data-m="local"><div class="ic">{{:~icon('file')}}</div><div><b>Sólo este dispositivo</b><span>Se guarda en el navegador. Útil para probar; haz respaldos.</span></div></button>
  </div>
</div></main>
</script>

<!-- Pantalla para iniciar sesión con Google. Datos: { folder } -->
<!-- Conectar Google. Datos: { folder, ro } (ro = modo solo lectura) -->
<script type="text/x-jsrender" id="connect">
<main><div class="setup">
  {{if ro}}
    <span class="badge st-violet" style="align-self:flex-start">Solo lectura</span>
    <h2>Conecta tu cuenta de Google</h2>
    <p class="muted" style="margin:0">Entra con <b>tu</b> cuenta. La app buscará la carpeta <b>{{>folder}}</b> que te compartieron y te mostrará el panel sin poder modificarlo.</p>
    <button class="btn primary block" id="cnx">{{:~icon('drive')}} Conectar con Google</button>
    <button class="btn ghost" id="salir">Salir</button>
  {{else}}
    <h2>Conecta tu Google Drive</h2>
    <p class="muted" style="margin:0">Se creará la carpeta <b>{{>folder}}</b>. La app sólo puede ver los archivos que ella misma crea.</p>
    <button class="btn primary block" id="cnx">{{:~icon('drive')}} Conectar con Google</button>
    <button class="btn ghost" id="loc">Usar sólo este dispositivo</button>
  {{/if}}
</div></main>
</script>

<!-- Lector con varios paneles compartidos. Datos: { lista:[{id, owner, email}] } -->
<script type="text/x-jsrender" id="elegir-panel">
<main><div class="setup">
  <h2>¿Qué panel quieres ver?</h2>
  <div class="sheet-opts">
    {{for lista}}<button class="sheet-opt" data-panel="{{:id}}"><div class="ic">{{:~icon('file')}}</div><div><b>{{>owner}}</b><span>{{>email}}</span></div></button>{{/for}}
  </div>
</div></main>
</script>

<!-- Aviso simple. Datos: { titulo, texto, reintentar } -->
<script type="text/x-jsrender" id="aviso">
<main><div class="setup">
  <h2>{{>titulo}}</h2>
  <p class="muted" style="margin:0">{{>texto}}</p>
  {{if reintentar}}<button class="btn primary block" id="reint">Reintentar</button>{{/if}}
  <button class="btn ghost" id="salir">Salir</button>
</div></main>
</script>

<!-- Compartir solo lectura (sólo dueño).
     Datos: { drive, url, pass, mensaje, folder, folderLink, consola, puedeCompartir } -->
<script type="text/x-jsrender" id="compartir">
{{if !drive}}
  <div class="readbox warn"><div class="ic">{{:~icon('drive')}}</div><div><b>Primero conecta Google Drive.</b> Para compartir, tus datos deben estar en Drive (Ajustes → Conectar Google Drive).</div></div>
{{else}}
<ol class="pasos">
  <li>
    <b>Agrégala como usuaria de prueba</b> en Google Cloud (si no lo has hecho).
    <div class="btnrow"><a class="btn sm" href="{{>consola}}" target="_blank" rel="noopener">{{:~icon('drive')}} Abrir Google Cloud → Público</a></div>
  </li>
  <li>
    <b>Comparte tu carpeta “{{>folder}}”</b> como Lector. Google le enviará un correo.
    <form id="shForm" class="share-row">
      <input id="shEmail" type="email" placeholder="correo@gmail.com" autocomplete="off" required>
      <button class="btn primary">{{:~icon('share')}} Compartir</button>
    </form>
    <div id="lectores"></div>
  </li>
  <li>
    <b>Envíale el acceso.</b>
    <div class="cfdi" style="margin-top:8px">
      <div class="cfdi-row"><span class="k">Dirección</span><span class="v">{{>url}}</span><button type="button" class="icon-btn mini" data-copy="{{>url}}" aria-label="Copiar dirección">{{:~icon('copy')}}</button></div>
      <div class="cfdi-row"><span class="k">Contraseña de solo lectura</span><span class="v"><b>{{>pass}}</b></span><button type="button" class="icon-btn mini" data-copy="{{>pass}}" aria-label="Copiar contraseña">{{:~icon('copy')}}</button></div>
    </div>
    <pre class="msg">{{>mensaje}}</pre>
    <div class="btnrow">
      <button type="button" class="btn sm primary" id="cpMsg">{{:~icon('copy')}} Copiar mensaje</button>
      {{if puedeCompartir}}<button type="button" class="btn sm" id="shMsg">{{:~icon('share')}} Enviar…</button>{{/if}}
      <a class="btn sm" href="https://wa.me/?text={{:~enc(mensaje)}}" target="_blank" rel="noopener">WhatsApp</a>
    </div>
  </li>
</ol>
<p class="hint">Para quitarle el acceso, usa “Quitar” en la lista de arriba: deja de ver el panel de inmediato aunque conozca la contraseña.</p>
{{/if}}
</script>

<!-- Personas con acceso de lectura. Datos: { lista:[{id, emailAddress, displayName}] } -->
<script type="text/x-jsrender" id="lectores">
{{if lista.length}}
<div class="list" style="margin-top:10px">
  {{for lista}}<div class="li"><div class="grow"><b>{{>displayName || emailAddress}}</b><small>{{>emailAddress}} · Lector</small></div>
    <button type="button" class="btn sm danger" data-quitar="{{:id}}">Quitar</button></div>{{/for}}
</div>
{{else}}<p class="hint">Todavía no la compartes con nadie.</p>{{/if}}
</script>

<!-- Ajustes: almacenamiento, exportar, contraseña.
     Datos: { drive, driveAvailable, minutos, ejemplo } -->
<script type="text/x-jsrender" id="ajustes">
{{if !ro}}
<fieldset><legend>Almacenamiento</legend>
  <p style="margin:0 0 10px">Modo actual: <b>{{if drive}}Google Drive{{else}}Sólo este dispositivo{{/if}}</b></p>
  {{if driveAvailable}}
    {{if drive}}<button class="btn" id="toLocal">Desconectar Drive</button>
    {{else}}<button class="btn primary" id="toDrive">{{:~icon('drive')}} Conectar Google Drive</button>{{/if}}
  {{else}}
    <p class="hint" style="margin:0">Para usar Drive, escribe tu GOOGLE_CLIENT_ID en CONFIG, al inicio de app.js.</p>
  {{/if}}
</fieldset>
<fieldset><legend>Nombres de archivo</legend>
  <p class="small" style="margin:0">Las facturas se guardan como <code>{{>ejemplo}}.pdf</code> y <code>.xml</code>.</p>
</fieldset>
{{/if}}
<fieldset><legend>Exportar</legend>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" id="csv">Facturas a Excel (CSV)</button>
    <button class="btn" id="bk">Respaldo de datos (JSON)</button>
    {{if !ro}}<button class="btn" id="rs">Restaurar respaldo</button>{{/if}}
  </div>
  <p class="hint">El respaldo JSON guarda los datos y referencias; los PDF se quedan en Drive.</p>
</fieldset>
{{if !ro}}
<fieldset><legend>Cambiar contraseña</legend>
  <p class="small" style="margin:0 0 8px">Bloqueo automático tras {{:minutos}} min sin uso. Escribe la nueva contraseña, copia el código y pégalo en <code>PASSWORD_SHA256</code> dentro de CONFIG en app.js.</p>
  <div class="form-grid">
    <label class="f full">Nueva contraseña<input id="newPw" type="text" autocomplete="off"></label>
    <button type="button" class="btn" id="genHash">Generar código</button>
  </div>
  <code id="hashOut" class="hash-out"></code>
</fieldset>
{{/if}}
</script>

<!-- Pie del visor de PDF/XML. Datos: { link } (enlace a Drive, opcional) -->
<script type="text/x-jsrender" id="viewer-footer">
<span class="spacer"></span>
{{if link}}<a class="btn" href="{{>link}}" target="_blank" rel="noopener">{{:~icon('drive')}} Abrir en Drive</a>{{/if}}
<a class="btn" id="vtab" target="_blank" rel="noopener">Abrir en pestaña</a>
<a class="btn primary" id="vdl">Descargar</a>
</script>

<!-- Resumen legible de un XML CFDI + el XML completo. Datos: resultado de CFDI.parse() + { tipoLabel, texto } -->
<script type="text/x-jsrender" id="xml-resumen">
<div class="calc" style="width:100%;background:var(--surface)">
  <div class="row"><span>Tipo</span><b>{{>tipoLabel}}</b></div>
  <div class="row"><span>Emisor</span><span>{{>emisorRfc}} · {{>emisorNombre}}</span></div>
  <div class="row"><span>Receptor</span><span>{{>receptorNombre}}</span></div>
  <div class="row"><span>UUID</span><span style="font-size:12px">{{>uuid}}</span></div>
  {{if tipo=='P'}}
    {{for pagos}}<div class="row total"><span>Pago {{:~fecha(fecha)}}</span><span>{{:~money(monto)}}</span></div>{{/for}}
  {{else}}
    <div class="row"><span>Subtotal</span><span>{{:~money(subtotal)}}</span></div>
    <div class="row"><span>IVA</span><span>{{:~money(iva)}}</span></div>
    <div class="row total"><span>Total</span><span>{{:~money(total)}}</span></div>
  {{/if}}
</div>
<pre>{{>texto}}</pre>
</script>


<!-- =================================================================
     2. FACTURAS
     ================================================================= -->

<!-- Página principal: indicadores, búsqueda, filtros y tarjetas.
     Datos: { k:{indicadores}, q, ordenLabel, chips:[], cards:[cardVM], hayFacturas } -->
<script type="text/x-jsrender" id="vista-facturas">
<div class="kpis">
  <div class="kpi amber"><small>Por cobrar</small><b>{{:~money(k.porCobrar)}}</b><span class="sub">{{:k.nPend}} factura(s)</span></div>
  <div class="kpi green"><small>Cobrado {{:k.year}}</small><b>{{:~money(k.cobrado)}}</b><span class="sub">Sin IVA: {{:~money(k.cobradoSinIva)}}</span></div>
  <div class="kpi"><small>Por facturar</small><b>{{:k.nPorFacturar}}</b><span class="sub">solicitud(es) recibidas</span></div>
  <div class="kpi navy"><small>IVA cobrado {{:k.year}}</small><b>{{:~money(k.ivaAnual)}}</b><span class="sub">Retenido {{:~money(k.ivaRetAnual)}} · neto {{:~money(k.ivaNetoAnual)}}</span></div>
  <a class="kpi violet" href="#/saldos"><small>Saldo a favor disponible</small><b>{{:~money(k.saldoDisp)}}</b><span class="sub">en {{:k.nSaldo}} declaración(es)</span></a>
</div>
<div class="toolbar">
  <div class="search">{{:~icon('search')}}<input id="q" type="search" placeholder="Buscar referencia, folio, UUID, sede…" value="{{>q}}"></div>
  <button class="btn" id="orden" title="Cambiar orden">{{>ordenLabel}}</button>
</div>
<div class="chips">
  {{for chips}}<button class="chip {{if on}}on{{/if}}" data-f="{{:k}}">{{>label}}<span class="c">{{:count}}</span></button>{{/for}}
</div>
{{if cards.length}}
  <div class="table-wrap">
    <table class="ftable">
      <thead><tr>
        <th>#</th><th>Referencia</th><th>Estado</th>
        <th class="r">Cantidad</th><th class="r">Cobrado</th><th>Descripción</th>
        <th>Parcialidad</th><th class="opt">Sede</th><th class="opt">Fecha alta</th><th>Siguiente paso</th>
      </tr></thead>
      <tbody>{{for cards tmpl="factura-row"/}}</tbody>
    </table>
  </div>
  <p class="hint" style="margin:8px 2px">Toca un renglón para abrirlo.</p>
{{else hayFacturas}}
  <div class="empty"><h3>Sin resultados</h3><p>Prueba con otro filtro o búsqueda.</p></div>
{{else}}
  <div class="empty"><h3>Aún no hay facturas</h3><p>Empieza subiendo el PDF que te llega para facturar.</p>
    <button class="btn primary" id="emptyNew">{{:~icon('plus')}} Nueva factura</button></div>
{{/if}}
</script>

<!-- Renglón de la tabla de facturas (en el orden en que se agregaron).
     En escritorio es una fila; en celular el CSS lo convierte en tarjeta
     (cada celda muestra su título con data-l).
     "Cobrado" muestra el total a pagar: en gris mientras no se cobra.
     Datos: cardVM() en app.js -->
<script type="text/x-jsrender" id="factura-row">
<tr class="frow e-{{:estado}}" data-id="{{:id}}" tabindex="0">
  <td class="seqc"><span class="seq">{{:seq}}</span></td>
  <td class="refc"><b>{{>ref}}</b>{{if metodo}}<small>{{>metodo}}</small>{{/if}}</td>
  <td class="estc"><span class="badge {{:estadoCls}}">{{>estadoLabel}}</span></td>
  <td class="r num" data-l="Cantidad">{{:~money(subtotal)}}</td>
  <td class="r num cobc" data-l="{{if cobrado}}Cobrado{{else}}Por cobrar{{/if}}">{{if cobrado}}<b>{{:~money(cobrado)}}</b>{{else}}<span class="muted" title="Total a pagar, aún no cobrado">{{:~money(total)}}</span>{{/if}}</td>
  <td class="desc" title="{{>desc}}"><span>{{>desc}}</span></td>
  <td data-l="Parcialidad">{{>parcialidadTxt}}</td>
  <td class="opt" data-l="Sede">{{>sede}}</td>
  <td class="opt" data-l="Alta">{{>alta}}</td>
  <td class="nextc">{{>sig}}</td>
</tr>
</script>


<!-- Menú del botón "+" -->
<script type="text/x-jsrender" id="fab-sheet">
<div class="sheet-opts">
  <button class="sheet-opt star" data-a="pdf"><div class="ic">{{:~icon('scan')}}</div><div><b>Nueva desde PDF de solicitud</b><span>Sube el comprobante de la UNAM y leo referencia, actividad, periodo y desglose.</span></div></button>
  <button class="sheet-opt" data-a="new"><div class="ic">{{:~icon('file')}}</div><div><b>Nueva factura en blanco</b><span>Captura los datos a mano.</span></div></button>
  <button class="sheet-opt" data-a="xml"><div class="ic">{{:~icon('upload')}}</div><div><b>Nueva desde XML de factura</b><span>Llena folio, UUID, cliente e importes automáticamente.</span></div></button>
  <button class="sheet-opt" data-a="rep"><div class="ic">{{:~icon('coin')}}</div><div><b>Cargar complemento de pago</b><span>Sube el PDF o XML del complemento y lo asigno a su factura por UUID.</span></div></button>
</div>
</script>

<!-- Formulario de factura. Las partes dinámicas (#tl, #slots, #calc, #cobroHint)
     se llenan desde app.js con las plantillas factura-timeline, slots, factura-calc y factura-cobro.
     Datos: { f:factura, isNew, sedes:[] } -->
<script type="text/x-jsrender" id="factura-form">
<form id="ff" autocomplete="off">
  <div class="timeline" id="tl"></div>
  <div id="readbox"></div>

  <fieldset><legend>Documentos</legend>
    <div class="slots" id="slots"></div>
    <p class="hint">Se guardarán como <b id="nombreArchivo"></b>. Los datos se leen solos al subir el PDF de solicitud, la factura (PDF o XML) y el complemento.</p>
  </fieldset>

  <fieldset><legend>Datos</legend>
    <div class="form-grid r1">
      <label class="f">No. consecutivo<input name="seq" type="number" min="1" inputmode="numeric" value="{{:f.seq}}" required></label>
      <label class="f">Referencia<input name="referencia" value="{{>f.referencia}}" placeholder="00510-01"></label>
      <label class="f full">Sede<input name="sede" value="{{>f.sede}}" placeholder="DGTIC Mascarones" list="sedes"></label>
      <label class="f full">Descripción <span style="font-weight:400">(actividad + periodo)</span><textarea name="descripcion" rows="4">{{>f.descripcion}}</textarea></label>
    </div>
    <datalist id="sedes">{{for sedes}}<option value="{{>#data}}">{{/for}}</datalist>

    <!-- Colapsado: se llena solo con los PDF/XML; trae valores por defecto -->
    <details class="sub-acc">
      <summary><span>Contrato y parcialidad</span><em id="resContrato"></em>{{:~icon('chev')}}</summary>
      <div class="form-grid">
        <label class="f full">Referencia del contrato<input name="contrato" value="{{>f.contrato}}" placeholder="522-08-2026-00510"></label>
        <label class="f">Parcialidad<input name="parcialidad" type="number" min="1" inputmode="numeric" value="{{:f.parcialidad || ''}}"></label>
        <label class="f">De<input name="parcialidades" type="number" min="1" inputmode="numeric" value="{{:f.parcialidades || ''}}"></label>
      </div>
    </details>
    <details class="sub-acc">
      <summary><span>Folio, UUID y cliente</span><em id="resCfdi"></em>{{:~icon('chev')}}</summary>
      <div class="form-grid r1">
        <label class="f">Serie y folio<input name="folio" value="{{>f.folio}}"></label>
        <label class="f">Fecha de emisión<input name="fechaEmision" type="date" value="{{>f.fechaEmision}}"></label>
        <label class="f full">UUID (folio fiscal)<input name="uuid" value="{{>f.uuid}}" style="text-transform:uppercase;font-size:13px"></label>
        <label class="f">Cliente (receptor)<input name="cliente" value="{{>f.cliente}}"></label>
        <label class="f">RFC del cliente<input name="rfcCliente" value="{{>f.rfcCliente}}" style="text-transform:uppercase"></label>
        <label class="f">Tu RFC (emisor)<input name="rfcEmisor" value="{{>f.rfcEmisor}}" style="text-transform:uppercase"></label>
        <label class="f">Método de pago<select name="metodoPago">
          <option value="PPD" {{if f.metodoPago=='PPD'}}selected{{/if}}>PPD · Parcialidades o diferido</option>
          <option value="PUE" {{if f.metodoPago=='PUE'}}selected{{/if}}>PUE · Una sola exhibición</option>
        </select></label>
      </div>
    </details>
  </fieldset>

  <fieldset><legend>Importes</legend>
    <label class="f">Cantidad (sin IVA)<input name="subtotal" type="number" step="0.01" inputmode="decimal" value="{{:f.subtotal || ''}}" placeholder="11075.00"></label>
    <details class="sub-acc">
      <summary><span>Porcentajes</span><em id="resPct"></em>{{:~icon('chev')}}</summary>
      <div class="form-grid" style="grid-template-columns:repeat(3,1fr)">
        <label class="f">IVA %<input name="ivaRate" type="number" step="0.01" inputmode="decimal" value="{{:f.ivaRate}}"></label>
        <label class="f">Ret. ISR %<input name="retIsrRate" type="number" step="0.01" inputmode="decimal" value="{{:f.retIsrRate}}"></label>
        <label class="f">Ret. IVA %<input name="retIvaRate" type="number" step="0.01" inputmode="decimal" value="{{:f.retIvaRate}}"></label>
      </div>
    </details>
    <div class="calc" id="calc"></div>
  </fieldset>

  <fieldset><legend>Estado</legend>
    <label class="check"><input type="checkbox" name="pagadaSinComplemento" {{if f.pagadaSinComplemento}}checked{{/if}}> Cobrada sin complemento (factura PUE)</label>
    <label class="check" style="margin-top:8px"><input type="checkbox" name="cancelada" {{if f.cancelada}}checked{{/if}}> Factura cancelada</label>
    <p class="hint" id="cobroHint"></p>
    <!-- Colapsado: se llena solo con el complemento (PDF o XML) -->
    <details class="sub-acc">
      <summary><span>Complemento de pago</span><em id="resComp"></em>{{:~icon('chev')}}</summary>
      <div class="form-grid r1">
        <label class="f">Fecha de pago<input name="fechaCobro" type="date" value="{{>f.fechaCobro}}"></label>
        <label class="f">Monto pagado<input name="montoCobrado" type="number" step="0.01" inputmode="decimal" value="{{:f.montoCobrado || ''}}" placeholder="= total a pagar"></label>
        <label class="f full">UUID del complemento<input name="compUuid" value="{{>f.complemento.uuid}}" style="text-transform:uppercase;font-size:13px"></label>
        <label class="f">Parcialidad pagada<input name="compParcialidad" type="number" min="1" inputmode="numeric" value="{{:f.complemento.parcialidad || ''}}"></label>
        <label class="f">Saldo insoluto<input name="compSaldo" type="number" step="0.01" inputmode="decimal" value="{{:f.complemento.saldoInsoluto ?? ''}}"></label>
      </div>
    </details>
  </fieldset>

  <fieldset><legend>Notas</legend><label class="f"><textarea name="notas" rows="2">{{>f.notas}}</textarea></label></fieldset>
</form>
</script>

<!-- Botones del formulario de factura. Datos: { isNew } -->
<script type="text/x-jsrender" id="factura-footer">
{{if !isNew}}<button class="btn danger" id="del">Eliminar</button>{{/if}}
<button class="btn" id="datosFac" title="Datos para facturar con esta cantidad y descripción">{{:~icon('copy')}} Datos para facturar</button>
<span class="spacer"></span>
<button class="btn" data-close>Cancelar</button>
<button class="btn primary" id="save">Guardar</button>
</script>

<!-- Las 3 etapas: Solicitud → Factura + XML → Cobrado. Datos: { etapas:[{t,n,done}] } -->
<script type="text/x-jsrender" id="factura-timeline">
{{for etapas}}<div class="tl {{if done}}done{{/if}}"><span class="n">{{if done}}✓{{else}}{{:n}}{{/if}}</span><b>{{>t}}</b></div>{{/for}}
</script>

<!-- Desglose del total. Datos: { subtotal, iva, retIsr, retIva, suma, total, noCuadra } -->
<script type="text/x-jsrender" id="factura-calc">
<div class="row hl"><span class="lbl">Cantidad <small>(monto sin IVA)</small></span><span>{{:~money(subtotal)}}</span></div>
<div class="row"><span class="lbl">+ IVA {{:ivaRate}}%</span><span>{{:~money(iva)}}</span></div>
<div class="row sep"><span class="lbl">Importe <small>(cantidad + IVA)</small></span><span>{{:~money(importe)}}</span></div>
{{if retIsr}}<div class="row"><span class="lbl">− Retención I.S.R. {{:retIsrRate}}%</span><span>{{:~money(retIsr)}}</span></div>{{/if}}
{{if retIva}}<div class="row"><span class="lbl">− Retención I.V.A. {{:retIvaRate}}%</span><span>{{:~money(retIva)}}</span></div>{{/if}}
<div class="row total"><span>Total a pagar</span><span>{{:~money(suma)}}</span></div>
{{if timbrado}}<p class="hint" style="margin:6px 0 0">Importes tomados de la factura timbrada.</p>{{/if}}
</script>

<!-- Estado y cobro. Datos: { label, cls, cobrado, sinIva, falta } -->
<script type="text/x-jsrender" id="factura-cobro">
Estado: <span class="badge {{:cls}}">{{>label}}</span>
{{if cobrado}} · Cobrado <b>{{:~money(cobrado)}}</b>{{if fecha}} el {{:~fecha(fecha)}}{{/if}}{{/if}}
</script>

<!-- Modal "Datos para facturar": calculadora + secciones con botón de copiar.
     Datos: { cantidad, secciones:[{titulo, icon, filas:[{label, valor, nota}]}] } -->
<script type="text/x-jsrender" id="datos-facturar">
<div class="df-calc">
  <label class="f">Cantidad de la solicitud (sin IVA)<input id="dfCant" type="number" step="0.01" inputmode="decimal" value="{{:cantidad}}" placeholder="11075.00"></label>
  <p class="hint" style="margin:6px 0 0">Escribe la cantidad y se llenan valor unitario, impuestos y total.</p>
</div>
{{for secciones}}
<section class="df-sec">
  <header><span class="ic">{{:~icon(icon)}}</span><h3>{{>titulo}}</h3>
    <button type="button" class="btn sm" data-cp="{{:#index}}.-1">{{:~icon('copy')}} Copiar sección</button></header>
  <div class="cfdi">
    {{for filas ~si=#index}}
    <div class="cfdi-row">
      <span class="k">{{>label}}</span>
      <span class="v">{{if valor}}{{>valor}}{{else}}<span class="muted">—</span>{{/if}}{{if nota}}<small>{{>nota}}</small>{{/if}}</span>
      {{if valor}}<button type="button" class="icon-btn mini" data-cp="{{:~si}}.{{:#getIndex()}}" aria-label="Copiar {{>label}}">{{:~icon('copy')}}</button>{{else}}<span></span>{{/if}}
    </div>
    {{/for}}
  </div>
</section>
{{/for}}
</script>

<!-- Resultado de leer el PDF de solicitud (texto u OCR).
     Datos: { ok, ocr, campos:[texto], avisos:[texto] } -->
<script type="text/x-jsrender" id="readbox">
<div class="readbox {{if !ok}}warn{{/if}}">
  <div class="ic">{{:~icon('scan')}}</div>
  <div>
    {{if ok}}
      <b>{{if titulo}}{{>titulo}}{{else}}Datos leídos del PDF{{/if}}{{if ocr}} con OCR{{/if}}</b> — revisa los campos resaltados en dorado.
    {{else}}
      <b>No pude leer datos de este archivo.</b> Captúralos a mano.
    {{/if}}
    {{if campos.length}}<ul>{{for campos}}<li>{{>#data}}</li>{{/for}}</ul>{{/if}}
    {{for avisos}}<p class="hint" style="color:var(--oro-ink)">⚠ {{>#data}}</p>{{/for}}
  </div>
</div>
</script>


<!-- =================================================================
     3. SALDOS A FAVOR  (nacen en una declaración mensual)
     ================================================================= -->

<!-- Página de saldos. "Disponibles" muestra sólo declaraciones con saldo > 0.
     Las agotadas salen de la lista y quedan en el historial plegado.
     Datos: { total, usado, disp, activos:[saldoVM], agotados:[saldoVM] } -->
<script type="text/x-jsrender" id="vista-saldos">
<div class="kpis" style="grid-template-columns:repeat(3,1fr)">
  <div class="kpi"><small>Acumulado</small><b>{{:~money(total)}}</b></div>
  <div class="kpi"><small>Usado</small><b>{{:~money(usado)}}</b></div>
  <div class="kpi violet"><small>Disponible</small><b>{{:~money(disp)}}</b></div>
</div>
{{if disp > 0}}
  <button class="btn primary block" id="usarSaldo" style="margin-bottom:6px">{{:~icon('coin')}} Usar saldo en una declaración</button>
  <p class="hint" style="margin:0 2px 12px">Se toma primero de las declaraciones más antiguas.</p>
{{/if}}

<div class="section-title"><h2>Declaraciones con saldo a favor ({{:activos.length}})</h2></div>
{{if activos.length}}
  <div class="grid">{{for activos tmpl="saldo-card"/}}</div>
{{else}}
  <div class="empty"><p>No tienes saldo a favor disponible. Se captura al cargar una declaración mensual, en “Saldo a favor de esta declaración”.</p></div>
{{/if}}

{{if agotados.length}}
<details class="year-acc" style="margin-top:14px">
  <summary>Historial · ya utilizados ({{:agotados.length}}) {{:~icon('chev')}}</summary>
  <div class="year-body"><div class="grid">{{for agotados tmpl="saldo-card"/}}</div></div>
</details>
{{/if}}
</script>

<!-- Tarjeta de saldo de una declaración. Datos: saldoVM() en app.js -->
<script type="text/x-jsrender" id="saldo-card">
<article class="saldo-card {{if agotado}}agotado{{/if}}" data-p="{{:periodo}}">
  <div class="card-top">
    <span class="ref">{{>label}}</span><span class="tag">{{>concepto}}</span><span style="flex:1"></span>
    {{if agotado}}<span class="badge st-gray">Utilizado</span>{{else}}<span class="badge st-violet">{{:~money(disp)}} disponible</span>{{/if}}
  </div>
  <div class="bar"><i style="width:{{:pct}}%"></i></div>
  <div class="meta">A favor {{:~money(monto)}} · usado {{:~money(usado)}}{{if nota}} · {{>nota}}{{/if}}</div>
  <div class="btnrow">
    {{if hasDecl}}<button type="button" class="btn sm" data-ver="declaracion">{{:~icon('file')}} Declaración</button>{{/if}}
    {{if hasVista}}<button type="button" class="btn sm" data-ver="vistaPrevia">{{:~icon('file')}} Vista previa</button>{{/if}}
    {{if !hasDecl && !hasVista}}<span class="small muted">Sin PDF cargado</span>{{/if}}
  </div>
  {{if usos.length}}
  <div class="usos">
    <small>Usado en</small>
    {{for usos}}
    <div class="li">
      <div class="grow"><b>{{:~money(monto)}}</b> · {{>periodoLabel}}<small>{{>nota}}</small></div>
      {{if hasDecl}}<button type="button" class="btn sm" data-decl="{{:periodo}}">Ver</button>{{/if}}
    </div>
    {{/for}}
  </div>
  {{/if}}
  <div class="btnrow">
    <button type="button" class="btn sm" data-open>Abrir declaración</button>
    {{if !agotado}}<button type="button" class="btn sm primary" data-aplicar>Registrar uso</button>{{/if}}
  </div>
</article>
</script>

<!-- Registrar o quitar usos de UN saldo. Datos: saldoVM() + { mes } -->
<script type="text/x-jsrender" id="saldo-modal">
<div class="kv" style="grid-template-columns:repeat(3,1fr)">
  <div><small>A favor {{>concepto}}</small><b>{{:~money(monto)}}</b></div>
  <div><small>Usado</small><b>{{:~money(usado)}}</b></div>
  <div><small>Disponible</small><b style="color:var(--violet)">{{:~money(disp)}}</b></div>
</div>
<div class="bar"><i style="width:{{:pct}}%"></i></div>
<p class="hint">Registra en qué declaración lo compensaste o acreditaste. Al llegar a $0 deja de aparecer en la lista de disponibles.</p>
<h3 style="font-size:14px;margin:16px 0 8px">Usos</h3>
<div class="list">
  {{for usos}}
    <div class="li"><div class="grow"><b>{{:~money(monto)}}</b> en la declaración de {{>periodoLabel}}<small>{{>nota}}{{if fecha}} · registrado {{:~fecha(fecha)}}{{/if}}</small></div>
    <button class="icon-btn" data-delap="{{:id}}" aria-label="Quitar">{{:~icon('x')}}</button></div>
  {{else}}
    <p class="muted small">Todavía no lo has usado.</p>
  {{/for}}
</div>
{{if disp > 0}}
<form id="apf" style="margin-top:16px"><div class="form-grid">
  <label class="f">Declaración donde lo usas<input name="periodo" type="month" value="{{:mes}}" min="{{:minMes}}" required></label>
  <label class="f">Monto usado<input name="monto" type="number" step="0.01" inputmode="decimal" value="{{:disp}}" max="{{:disp}}" required></label>
  <label class="f full">Nota<input name="nota" placeholder="Ej. compensado contra IVA a cargo"></label>
  <button class="btn primary full">Registrar uso</button>
</div></form>
{{else}}
  <p style="margin-top:14px"><span class="badge st-gray">Saldo utilizado por completo</span></p>
{{/if}}
</script>

<!-- Usar saldo repartido entre varias declaraciones. Datos: { mes, disp, conceptos:[] } -->
<script type="text/x-jsrender" id="usar-saldo">
<form id="usf"><div class="form-grid">
  <label class="f">Declaración donde lo usas<input name="periodo" type="month" value="{{:mes}}" required></label>
  <label class="f">Monto a usar<input name="monto" type="number" step="0.01" inputmode="decimal" value="{{:disp}}" required></label>
  <label class="f full">Impuesto<select name="concepto"><option value="">Todos</option>{{for conceptos}}<option>{{:#data}}</option>{{/for}}</select></label>
  <label class="f full">Nota<input name="nota" placeholder="Ej. compensado contra IVA a cargo"></label>
</div></form>
<h3 style="font-size:14px;margin:16px 0 8px">Se tomará de</h3>
<div id="usPrev"></div>
</script>

<!-- Vista previa del reparto. Datos: { filas:[{label,concepto,toma,queda}], faltante } -->
<script type="text/x-jsrender" id="usar-preview">
<div class="list">
  {{for filas}}
    <div class="li"><div class="grow"><b>{{>label}}</b><small>{{>concepto}} · le quedan {{:~money(queda)}}</small></div><b class="num">{{:~money(toma)}}</b></div>
  {{else}}<p class="muted small">No hay saldo de meses anteriores para ese impuesto.</p>{{/for}}
</div>
{{if faltante}}<p class="hint" style="color:var(--red)">Faltan {{:~money(faltante)}}: no hay saldo suficiente.</p>{{/if}}
</script>

<!-- Calendario de 12 meses. Datos: { year, presentadas, pagado, saldoDisp, meses:[...] } -->
<script type="text/x-jsrender" id="vista-mensuales">
<div class="toolbar">
  <button class="btn primary w" id="cargarAcuse" style="flex:1">{{:~icon('upload')}} Cargar acuse de declaración (detecta el mes)</button>
  <button class="btn" id="verRegimenes">{{:~icon('scale')}} Regímenes</button>
</div>
<div class="yearbar">
  <button class="icon-btn" id="yPrev" aria-label="Año anterior">{{:~icon('left')}}</button>
  <b>{{:year}}</b>
  <button class="icon-btn" id="yNext" aria-label="Año siguiente">{{:~icon('right')}}</button>
</div>
<div class="kpis" style="grid-template-columns:repeat(3,1fr)">
  <div class="kpi"><small>Presentadas</small><b>{{:presentadas}}/12</b></div>
  <div class="kpi"><small>Pagado</small><b>{{:~money(pagado)}}</b></div>
  <a class="kpi violet" href="#/saldos"><small>Saldo a favor disponible</small><b>{{:~money(saldoDisp)}}</b></a>
</div>
<div class="months">
  {{for meses}}
  <div class="month {{if futuro}}future{{/if}}" data-p="{{:p}}" tabindex="0">

    <div class="docchecks">
      <span class="{{if decl}}ok{{/if}}">{{if decl}}✓{{else}}○{{/if}} Declaración</span>
      <span class="{{if vista}}ok{{/if}}">{{if vista}}✓{{else}}○{{/if}} Vista previa</span>
    </div>
    {{if pagado}}<span class="small num">Pagado {{:~money(pagado)}}</span>{{/if}}
    {{if aFavor}}<span class="badge st-violet">A favor {{:~money(aFavor)}}</span>{{/if}}

<!-- Formulario de un mes. Incluye el saldo a favor que GENERA esta declaración
     y los saldos de otros meses que se USARON en ella.
     Datos: { r:registro, estados:[], conceptos:[], usosPropios:[], aplicadosAqui:[], hayDisp } -->
<script type="text/x-jsrender" id="mensual-form">
<form id="mf">
  <div id="mreadbox"></div>
  <fieldset><legend>Documentos</legend><div class="slots" id="mslots"></div>
    <p class="hint">Al subir el <b>acuse</b> o la <b>vista previa</b> del SAT se llenan solos la fecha, el estado, el ISR y el IVA, la cantidad a pagar y el saldo a favor.</p>
  </fieldset>
  <fieldset><legend>Datos</legend><div class="form-grid">
    <label class="f">Estado<select name="estado">{{for estados}}<option value="{{:k}}" {{if sel}}selected{{/if}}>{{>label}}</option>{{/for}}</select></label>
    <label class="f">Fecha de presentación<input name="fechaPresentacion" type="date" value="{{>r.fechaPresentacion}}"></label>
    <label class="f">ISR a cargo<input name="isr" type="number" step="0.01" inputmode="decimal" value="{{:r.isr || ''}}"></label>
    <label class="f">IVA a cargo<input name="iva" type="number" step="0.01" inputmode="decimal" value="{{:r.iva || ''}}"></label>
    <label class="f full">Cantidad a pagar / pagado<input name="totalPagado" type="number" step="0.01" inputmode="decimal" value="{{:r.totalPagado || ''}}"></label>
    <label class="f full">Notas<textarea name="notas" rows="2">{{>r.notas}}</textarea></label>
  </div></fieldset>

  <fieldset><legend>Cálculo sugerido del mes</legend>
    <div id="mresumen"></div>
    <button type="button" class="btn sm w" id="mUsarCalc">Usar en el formulario</button>
  </fieldset>

  <fieldset><legend>Saldo a favor de esta declaración</legend><div class="form-grid">
    <label class="f">Monto a favor<input name="saldoMonto" type="number" step="0.01" inputmode="decimal" value="{{:r.saldo.monto || ''}}" placeholder="0.00"></label>
    <label class="f">Impuesto<select name="saldoConcepto">{{for conceptos}}<option {{if sel}}selected{{/if}}>{{:v}}</option>{{/for}}</select></label>
    <label class="f full">Nota<input name="saldoNota" value="{{>r.saldo.nota}}" placeholder="Ej. IVA retenido mayor al trasladado"></label>
  </div>
  {{if usosPropios.length}}
    <p class="hint">Este saldo ya se usó en:</p>
    <div class="list">{{for usosPropios}}<div class="li"><div class="grow"><b>{{:~money(monto)}}</b> · {{>periodoLabel}}<small>{{>nota}}</small></div></div>{{/for}}</div>
  {{/if}}
  </fieldset>

  <fieldset><legend>Saldos a favor usados en este mes</legend>
    <div class="list">
      {{for aplicadosAqui}}
        <div class="li"><div class="grow"><b>{{:~money(monto)}}</b> de la declaración de {{>origenLabel}}<small>{{>concepto}}{{if nota}} · {{>nota}}{{/if}}</small></div>
        <button type="button" class="btn sm" data-origen="{{:origen}}">Ver origen</button></div>
      {{else}}
        <p class="muted small" style="margin:0">Ninguno registrado.</p>
      {{/for}}
    </div>
    {{if hayDisp}}<button type="button" class="btn" id="mUsar" style="margin-top:10px">{{:~icon('coin')}} Usar saldo a favor en este mes</button>{{/if}}
  </fieldset>
</form>
</script>

<!-- Botones del formulario mensual. Datos: { existe } -->
<script type="text/x-jsrender" id="mensual-footer">
{{if existe}}<button class="btn danger" id="mdel">Borrar mes</button>{{/if}}
<span class="spacer"></span>
<button class="btn" data-close>Cancelar</button>
<button class="btn primary" id="msave">Guardar</button>
</script>

<!-- Lista de ejercicios como acordeón. Datos: { anios:[{y, abierto, presentada, resultado, monto, fecha, notas, docs:[]}] } -->

<div class="section-title" style="margin-top:4px">
  <h2>Ejercicios fiscales</h2>
  <button class="btn primary sm" id="addY">{{:~icon('plus')}} Agregar ejercicio</button>
</div>
<p class="muted small" style="margin:-4px 2px 12px">La declaración anual de personas físicas se presenta en abril del año siguiente.</p>
{{for anios}}
<details class="year-acc" {{if abierto}}open{{/if}}>
  <summary>{{:~icon('archive')}} Ejercicio {{:y}} <span class="badge {{if presentada}}st-green{{else}}st-gray{{/if}}">{{if presentada}}Presentada{{else}}Pendiente{{/if}}</span>{{:~icon('chev')}}</summary>
  <div class="year-body">
    <div class="kv">
      <div><small>Resultado</small><b>{{>resultado}}</b></div>
      <div><small>Monto</small><b class="num">{{:~money(monto)}}</b></div>
      <div><small>Presentada</small><b>{{if fecha}}{{:~fecha(fecha)}}{{else}}—{{/if}}</b></div>
      <div><small>Documentos</small><b>{{:docs.length}}</b></div>
    </div>
    {{if notas}}<p class="small" style="margin:0">{{>notas}}</p>{{/if}}
    <div class="list">
      {{for docs ~y=y}}
        <div class="li"><span class="mini-ico">{{>ext}}</span><div class="grow"><b>{{>tipo}}</b><small>{{>nombre}}</small></div>
        <button class="btn sm" data-view="{{:~y}}|{{:id}}">Ver</button></div>
      {{else}}<p class="muted small" style="margin:0">Sin documentos.</p>{{/for}}
    </div>
    <button class="btn" data-edit="{{:y}}">Editar ejercicio {{:y}}</button>
  </div>
</details>
{{else}}
<div class="empty"><h3>Sin ejercicios</h3><p>Agrega el año de tu declaración anual.</p></div>
{{/for}}
</script>

<!-- Pedir año nuevo. Datos: { def } -->
<script type="text/x-jsrender" id="nuevo-ejercicio">
<label class="f">Año del ejercicio<input id="ny" type="number" min="2000" max="2100" value="{{:def}}"></label>
</script>

<!-- Formulario de un ejercicio anual. Datos: { a, tipos:[], resultados:[] } -->
<script type="text/x-jsrender" id="anual-form">
<form id="af">
  <fieldset><legend>Datos</legend><div class="form-grid">
    <label class="f">Estado<select name="estado"><option value="pendiente">Pendiente</option><option value="presentada" {{if a.estado=='presentada'}}selected{{/if}}>Presentada</option></select></label>
    <label class="f">Fecha de presentación<input type="date" name="fechaPresentacion" value="{{>a.fechaPresentacion}}"></label>
    <label class="f">Resultado<select name="resultado"><option value="">—</option>{{for resultados}}<option value="{{:k}}" {{if sel}}selected{{/if}}>{{>label}}</option>{{/for}}</select></label>
    <label class="f">Monto<input type="number" step="0.01" inputmode="decimal" name="monto" value="{{:a.monto || ''}}"></label>
    <label class="f full">Notas<textarea name="notas" rows="2">{{>a.notas}}</textarea></label>
  </div></fieldset>
  <fieldset><legend>Documentos</legend>
    <div class="list" id="adocs"></div>
    <div class="form-grid" style="margin-top:10px">
      <label class="f">Tipo<select id="atipo">{{for tipos}}<option>{{>#data}}</option>{{/for}}</select></label>
      <button type="button" class="btn" id="aadd" style="align-self:end">{{:~icon('upload')}} Agregar PDF</button>
    </div>
  </fieldset>
</form>
</script>

<!-- Documentos del ejercicio (guardados + nuevos). Datos: { rows:[{id,tipo,nombre,quitar}] } -->
<script type="text/x-jsrender" id="anual-docs">
{{for rows}}
<div class="li" {{if quitar}}style="opacity:.5;text-decoration:line-through"{{/if}}>
  <div class="grow"><b>{{>tipo}}</b><small>{{>nombre}}</small></div>
  <button type="button" class="btn sm" data-v="{{:id}}">Ver</button>
  <button type="button" class="icon-btn" data-r="{{:id}}" aria-label="Quitar">{{if quitar}}↺{{else}}{{:~icon('x')}}{{/if}}</button>
</div>
{{else}}<p class="muted small" style="margin:0">Sin documentos.</p>{{/for}}
</script>

<!-- Botones del formulario anual -->
<script type="text/x-jsrender" id="anual-footer">
<button class="btn danger" id="adel">Eliminar ejercicio</button>
<span class="spacer"></span>
<button class="btn" data-close>Cancelar</button>
<button class="btn primary" id="asave">Guardar</button>
</script>


<!-- =================================================================
     6. GASTOS (facturas recibidas)
     ================================================================= -->

<!-- Página de gastos. Datos: ver renderGastos() en app.js -->
<script type="text/x-jsrender" id="vista-gastos">
<div class="kpis">
  <div class="kpi"><small>Subtotal</small><b>{{:~money(k.subtotal)}}</b><span class="sub">{{:k.cuentan}} de {{:k.n}} factura(s) cuentan</span></div>
  <div class="kpi navy"><small>IVA acreditable</small><b>{{:~money(k.iva)}}</b><span class="sub">de lo filtrado</span></div>
  <div class="kpi green"><small>Total</small><b>{{:~money(k.total)}}</b><span class="sub">{{if k.canceladas}}{{:k.canceladas}} cancelada(s) excluidas{{else}}sin canceladas{{/if}}</span></div>
  <div class="kpi amber"><small>Por clasificar</small><b>{{:k.porClasificar}}</b><span class="sub">se calculan como gasto general</span></div>
</div>
<div class="toolbar">
  {{if !ro}}<button class="btn primary" id="gCargar">{{:~icon('upload')}} Cargar del SAT</button>{{/if}}
  <div class="search">{{:~icon('search')}}<input id="gq" type="search" placeholder="Buscar emisor, RFC, UUID, concepto…" value="{{>q}}"></div>
</div>
{{if hay}}
<div class="mes-chips">
  {{if anios.length > 1}}<select id="gAnio" class="anio-sel">{{for anios}}<option {{if #data==~root.anio}}selected{{/if}}>{{:#data}}</option>{{/for}}</select>{{else}}<b class="anio-lbl">{{:anio}}</b>{{/if}}
  {{for meses}}<button class="mchip {{if on}}on{{/if}} {{if !n}}vacio{{/if}}" data-mes="{{:p}}" title="{{:n}} factura(s)">{{:m}}</button>{{/for}}
</div>
<div class="toolbar small">
  {{if activosTxt}}<span class="badge st-violet">Filtros: {{>activosTxt}}</span><button class="btn sm" id="gLimpiar">Quitar filtros</button>{{/if}}
  <span style="flex:1"></span>
  {{if !ro}}<button class="btn sm" id="gAsignar">Asignar tipo a las visibles</button>{{/if}}
  <button class="btn sm" id="gCsv">Exportar CSV</button>
</div>
<div class="table-wrap">
  <table class="xtable">
    <thead><tr>
      <th><button class="th" data-gf="mes">Fecha {{:cols.mes.sort}}<i class="fx {{if cols.mes.on}}on{{/if}}">{{:~icon('filter')}}</i></button></th>
      <th><button class="th" data-gf="emisor">Emisor {{:cols.emisor.sort}}<i class="fx {{if cols.emisor.on}}on{{/if}}">{{:~icon('filter')}}</i></button></th>
      <th><button class="th" data-gf="efecto">Efecto<i class="fx {{if cols.efecto.on}}on{{/if}}">{{:~icon('filter')}}</i></button></th>
      <th><button class="th" data-gf="tipo">Tipo factura {{:cols.tipo.sort}}<i class="fx {{if cols.tipo.on}}on{{/if}}">{{:~icon('filter')}}</i></button></th>
      <th class="r"><button class="th" data-gsort="monto">Monto</button></th>
      <th class="r">Subtotal</th><th class="r">IVA</th><th class="r">Total</th>
      <th><button class="th" data-gf="estatus">Estatus<i class="fx {{if cols.estatus.on}}on{{/if}}">{{:~icon('filter')}}</i></button></th>
    </tr></thead>
    <tbody>
      {{for filas}}
      <tr class="grow-row {{if cancelada}}x-cancel{{/if}} {{if !cuenta}}x-fuera{{/if}}" data-uuid="{{:uuid}}">
        <td class="nowrap" data-l="Fecha">{{>fecha}} <small class="muted">{{>hora}}</small></td>
        <td class="x-main"><b>{{>emisor}}</b><small>{{>rfc}}{{if xml}} · <span class="tag">XML</span>{{/if}}</small></td>
        <td data-l="Efecto"><span class="tag">{{>efecto}}</span></td>
        <td data-l="Tipo">
          {{if ~root.ro}}{{>tipo || 'Sin clasificar'}}{{else}}
          <select class="tsel {{if sinTipo}}warn{{/if}}" data-gtipo="{{:uuid}}">
            <option value="">Sin clasificar</option>
            {{for ~root.tipos ~t=tipo}}<option {{if #data==~t}}selected{{/if}}>{{:#data}}</option>{{/for}}
          </select>{{/if}}
        </td>
        <td class="r num" data-l="Monto">{{:~money(monto)}}</td>
        <td class="r num" data-l="Subtotal">{{if cuenta}}{{:~money(sub)}}{{else}}<span class="muted">—</span>{{/if}}</td>
        <td class="r num" data-l="IVA">{{if cuenta}}{{:~money(iva)}}{{else}}<span class="muted">—</span>{{/if}}</td>
        <td class="r num" data-l="Total">{{if cuenta}}<b>{{:~money(total)}}</b>{{else}}<span class="muted" title="{{>motivo}}">no cuenta</span>{{/if}}</td>
        <td data-l="Estatus">{{if cancelada}}<span class="badge st-red">Cancelada</span>{{else}}<span class="badge {{if cuenta}}st-green{{else}}st-gray{{/if}}" title="{{>motivo}}">{{if cuenta}}{{>motivo}}{{else}}{{>motivo}}{{/if}}</span>{{/if}}</td>
      </tr>
      {{/for}}
    </tbody>
    <tfoot><tr><td colspan="5"><b>Total de lo visible ({{:filas.length}})</b></td><td class="r num"><b>{{:~money(k.subtotal)}}</b></td><td class="r num"><b>{{:~money(k.iva)}}</b></td><td class="r num"><b>{{:~money(k.total)}}</b></td><td></td></tr></tfoot>
  </table>
</div>
<p class="hint">Toca una fila para ver el detalle. Al cambiar el tipo de un emisor se aplica también a sus otras facturas sin clasificar y se recuerda para próximas cargas.</p>
{{else}}
<div class="empty"><h3>Aún no hay gastos</h3><p>Carga el <b>ZIP</b> o el <b>TXT</b> de la descarga masiva del SAT, los <b>XML</b> de tus facturas recibidas o tu <b>Excel anterior</b>. Puedes subir varios a la vez; los repetidos (mismo UUID) se ignoran.</p></div>
{{/if}}
</script>

<!-- Ventana de filtro estilo Excel. Datos: { titulo, valores:[{v,label,n,on}] } -->
<script type="text/x-jsrender" id="filtro-pop">
<div class="xf-h"><b>{{>titulo}}</b></div>
<div class="xf-sort"><button type="button" class="btn sm" id="xfAsc">Ordenar A→Z ↑</button><button type="button" class="btn sm" id="xfDesc">Z→A ↓</button></div>
<input id="xfQ" type="search" placeholder="Buscar…" class="xf-q">
<label class="xf-i all"><input type="checkbox" id="xfAll" checked> (Seleccionar todo)</label>
<div class="xf-list">
  {{for valores}}<label class="xf-i"><input type="checkbox" data-xv="{{>v}}" data-l="{{>label}}" {{if on}}checked{{/if}}> <span>{{>label}}</span><em>{{:n}}</em></label>{{/for}}
</div>
<div class="xf-f"><button type="button" class="btn sm" id="xfCancel">Cancelar</button><button type="button" class="btn sm primary" id="xfOk">Aceptar</button></div>
</script>

<!-- Asignar tipo masivo. Datos: { tipos, n } -->
<script type="text/x-jsrender" id="asignar-tipo">
<label class="f">Tipo de factura<select id="atTipo"><option value="">Sin clasificar</option>{{for tipos}}<option>{{:#data}}</option>{{/for}}</select></label>
<p class="hint">Se aplicará a las {{:n}} facturas que están visibles con los filtros actuales.</p>
</script>

<!-- Resumen de importación de gastos -->
<script type="text/x-jsrender" id="import-res">
<div class="kv" style="grid-template-columns:repeat(2,1fr)">
  <div><small>Nuevas</small><b>{{:nuevas}}</b></div>
  <div><small>Duplicadas (mismo UUID, ignoradas)</small><b>{{:duplicadas}}</b></div>
  <div><small>Actualizadas</small><b>{{:actualizadas}}</b></div>
  <div><small>Emitidas por ti (no son gastos)</small><b>{{:emitidas}}</b></div>
</div>
<ul class="hint" style="margin-top:12px">
  <li>Archivos leídos: {{:archivos}}.</li>
  {{if canceladas}}<li>{{:canceladas}} factura(s) cancelada(s): se muestran pero no suman.</li>{{/if}}
  {{if porClasificar}}<li><b>{{:porClasificar}}</b> sin tipo: revísalas (se calculan como gasto general).</li>{{/if}}
  <li>"Actualizadas" = ya existían y llegó su XML (importes exactos) o cambiaron a canceladas.</li>
</ul>
{{for errores}}<p class="hint" style="color:var(--red)">⚠ {{>#data}}</p>{{/for}}
</script>

<!-- Detalle de un gasto. Datos: { g, c, efecto, tipos, fecha, hora } -->
<script type="text/x-jsrender" id="gasto-detalle">
<div class="kv">
  <div><small>Fecha</small><b>{{>fecha}}</b> <small>{{>hora}}</small></div>
  <div><small>Monto</small><b>{{:~money(g.monto)}}</b></div>
  <div><small>Efecto</small><b>{{>g.efecto}}</b> <small>{{>efecto}}</small></div>
  <div><small>Estatus</small><b>{{if g.estatus===0}}Cancelada{{else}}Vigente{{/if}}</b></div>
</div>
<div class="calc">
  <div class="row"><span>Subtotal</span><span>{{:~money(c.subtotal)}}</span></div>
  <div class="row"><span>IVA</span><span>{{:~money(c.iva)}}</span></div>
  <div class="row total"><span>Total</span><span>{{:~money(c.total)}}</span></div>
  <p class="hint" style="margin:6px 0 0">Cálculo: {{>c.motivo}}{{if c.motivo=='Estimado'}} (monto ÷ 1.16; carga el XML para importes exactos){{/if}}.</p>
</div>
<div class="form-grid" style="margin-top:14px">
  <label class="f">Tipo de factura<select id="gdTipo"><option value="">Sin clasificar</option>{{for tipos}}<option {{if sel}}selected{{/if}}>{{:t}}</option>{{/for}}</select></label>
  <label class="f">Nota<input id="gdNota" value="{{>g.nota}}"></label>
</div>
<div class="cfdi" style="margin-top:14px">
  <div class="cfdi-row"><span class="k">UUID</span><span class="v">{{>g.uuid}}</span><button type="button" class="icon-btn mini" data-copy="{{>g.uuid}}">{{:~icon('copy')}}</button></div>
  <div class="cfdi-row"><span class="k">Emisor</span><span class="v">{{>g.rfcEmisor}} · {{>g.nombreEmisor}}</span><span></span></div>
  <div class="cfdi-row"><span class="k">Receptor</span><span class="v">{{>g.rfcReceptor}} · {{>g.nombreReceptor}}</span><span></span></div>
  <div class="cfdi-row"><span class="k">PAC · Certificación</span><span class="v">{{>g.pac}} · {{>g.fechaCert}}</span><span></span></div>
  {{if g.fechaCancelacion}}<div class="cfdi-row"><span class="k">Cancelación</span><span class="v">{{>g.fechaCancelacion}}</span><span></span></div>{{/if}}
  {{if g.cfdi}}
  <div class="cfdi-row"><span class="k">Conceptos</span><span class="v">{{>g.cfdi.conceptos}}</span><span></span></div>
  <div class="cfdi-row"><span class="k">Uso CFDI · Método · Forma</span><span class="v">{{>g.cfdi.usoCfdi}} · {{>g.cfdi.metodoPago}} · {{>g.cfdi.formaPago}}</span><span></span></div>
  {{if g.cfdi.ivaRet || g.cfdi.isrRet}}<div class="cfdi-row"><span class="k">Retenciones</span><span class="v">IVA {{:~money(g.cfdi.ivaRet)}} · ISR {{:~money(g.cfdi.isrRet)}}</span><span></span></div>{{/if}}
  {{/if}}
  <div class="cfdi-row"><span class="k">Origen</span><span class="v">{{>g.origen}}</span><span></span></div>
</div>
</script>
<script type="text/x-jsrender" id="gasto-footer">
<button class="btn danger" id="gdDel">Quitar</button>
<span class="spacer"></span>
<button class="btn" data-close>Cerrar</button>
<button class="btn primary" id="gdSave">Guardar</button>
</script>


<!-- =================================================================
     7. BANCO
     ================================================================= -->
<script type="text/x-jsrender" id="vista-banco">
<div class="kpis">
  <div class="kpi green"><small>Depósitos</small><b>{{:~money(k.dep)}}</b><span class="sub">{{:k.n}} movimiento(s) visibles</span></div>
  <div class="kpi amber"><small>Retiros</small><b>{{:~money(k.ret)}}</b><span class="sub">Neto {{:~money(k.neto)}}</span></div>
  <div class="kpi navy"><small>Pagos de facturas</small><b>{{:~money(k.concMonto)}}</b><span class="sub">{{:k.conc}} depósito(s) vinculados</span></div>
  <div class="kpi {{if k.falta}}violet{{/if}}"><small>Falta complemento</small><b>{{:k.falta}}</b><span class="sub">te pagaron y no lo has subido</span></div>
</div>
<div class="toolbar">
  {{if !ro}}<button class="btn primary" id="bCargar">{{:~icon('upload')}} Cargar estado de cuenta</button>
  <button class="btn" data-bplant title="Machote de Excel para capturar tus movimientos">{{:~icon('download')}} Plantilla</button>
  <button class="btn" id="bConciliar">{{:~icon('refresh')}} Conciliar</button>{{/if}}
  <div class="search">{{:~icon('search')}}<input id="bq" type="search" placeholder="Buscar concepto, importe…" value="{{>q}}"></div>
</div>
{{if hay}}
<div class="mes-chips">
  {{if anios.length > 1}}<select id="bAnio" class="anio-sel">{{for anios}}<option {{if #data==~root.anio}}selected{{/if}}>{{:#data}}</option>{{/for}}</select>{{else}}<b class="anio-lbl">{{:anio}}</b>{{/if}}
  {{for meses}}<button class="mchip {{if on}}on{{/if}} {{if !n}}vacio{{/if}}" data-bmes="{{:p}}">{{:m}}</button>{{/for}}
</div>
{{if activosTxt}}<div class="toolbar small"><span class="badge st-violet">Filtros: {{>activosTxt}}</span><button class="btn sm" id="bLimpiar">Quitar filtros</button></div>{{/if}}
<div class="table-wrap">
  <table class="xtable">
    <thead><tr>
      <th><button class="th" data-bf="mes">Fecha {{:cols.mes.sort}}<i class="fx {{if cols.mes.on}}on{{/if}}">{{:~icon('filter')}}</i></button></th>
      <th>Concepto</th>
      <th><button class="th" data-bf="tipo">Tipo<i class="fx {{if cols.tipo.on}}on{{/if}}">{{:~icon('filter')}}</i></button></th>
      <th class="r"><button class="th" data-bf="mov">Retiro<i class="fx {{if cols.mov.on}}on{{/if}}">{{:~icon('filter')}}</i></button></th>
      <th class="r">Depósito</th>
      <th><button class="th" data-bf="conc">Complemento<i class="fx {{if cols.conc.on}}on{{/if}}">{{:~icon('filter')}}</i></button></th>
    </tr></thead>
    <tbody>
      {{for filas}}
      <tr{{if cie}} class="cie" title="Depósito CIE (pago UNAM)"{{/if}}>
        <td class="nowrap" data-l="Fecha">{{>fecha}} <small class="muted">{{>hora}}</small></td>
        <td class="x-main"><b>{{>concepto}}</b></td>
        <td data-l="Tipo"><span class="tag">{{>tipo}}</span></td>
        <td class="r num" data-l="Retiro">{{if retiro}}<span style="color:var(--red)">-{{:~money(retiro)}}</span>{{else}}<span class="muted">—</span>{{/if}}</td>
        <td class="r num" data-l="Depósito">{{if deposito}}<b style="color:var(--green)">{{:~money(deposito)}}</b>{{else}}<span class="muted">—</span>{{/if}}</td>
        <td data-l="Complemento">
          {{if fac}}
            <button class="btn sm" data-fac="{{:fac.id}}">{{if fac.ok}}✅{{else}}⚠{{/if}} #{{:fac.seq}} {{>fac.ref}}</button>
            {{if fac.dif}}<small class="muted">dif. {{:~money(fac.dif)}}</small>{{/if}}
            {{if !~root.ro}}<button class="icon-btn mini" data-vinc="{{:id}}" title="Cambiar vínculo">{{:~icon('layers')}}</button>{{/if}}
          {{else puedeVincular && !~root.ro}}<button class="btn sm" data-vinc="{{:id}}">Vincular factura</button>
          {{/if}}
        </td>
      </tr>
      {{/for}}
    </tbody>
    <tfoot><tr><td colspan="3"><b>Total de lo visible ({{:filas.length}})</b></td><td class="r num"><b>-{{:~money(k.ret)}}</b></td><td class="r num"><b>{{:~money(k.dep)}}</b></td><td></td></tr></tfoot>
  </table>
</div>
<p class="hint"><span class="cie-dot"></span> Fila amarilla = depósito CIE (pago UNAM). Los depósitos se vinculan solos con la factura del mismo total (±{{:~tol()}}). ✅ = ya subiste el complemento; ⚠ = te pagaron pero falta el complemento.</p>
{{else}}
<div class="empty"><h3>Sin movimientos</h3>
  <p><b>1.</b> Descarga la plantilla · <b>2.</b> Captura tus movimientos (fecha, concepto, retiro o depósito) · <b>3.</b> Súbela con “Cargar estado de cuenta”.</p>
  <p class="muted">También acepta la exportación .xlsx/.csv de Santander. No se permiten duplicados: misma fecha + concepto + monto.</p>
  {{if !ro}}<button class="btn primary" data-bplant>{{:~icon('download')}} Descargar plantilla</button>{{/if}}
</div>
{{/if}}
</script>

<script type="text/x-jsrender" id="import-banco">
<div class="kv" style="grid-template-columns:repeat(3,1fr)">
  <div><small>Nuevos</small><b>{{:nuevas}}</b></div>
  <div><small>Duplicados (ignorados)</small><b>{{:duplicadas}}</b></div>
  <div><small>Vinculados a facturas</small><b>{{:conciliadas}}</b></div>
</div>
{{if plantilla}}<p class="hint">✔ Archivo reconocido como <b>plantilla oficial</b>.</p>{{/if}}
{{for errores}}<p class="hint" style="color:var(--red)">⚠ {{>#data}}</p>{{/for}}
{{if filasError.length}}
<details class="ib-det" open><summary style="color:var(--red)"><b>{{:filasError.length}} fila(s) con error — no se cargaron</b></summary>
  <ul>{{for filasError}}<li>{{>#data}}</li>{{/for}}</ul>
  <p class="hint">Corrígelas en el Excel y vuelve a subirlo: lo que ya entró se detecta como duplicado y no se repite.</p>
</details>
{{/if}}
{{if dupDetalle.length}}
<details class="ib-det"><summary><b>{{:dupDetalle.length}} duplicado(s) ignorado(s)</b> <small class="muted">misma fecha + concepto + monto</small></summary>
  <ul>{{for dupDetalle}}<li>{{>#data}}</li>{{/for}}</ul>
</details>
{{/if}}
</script>

<script type="text/x-jsrender" id="vincular">
<p class="hint" style="margin-top:0">{{>concepto}}</p>
<div class="list">
  {{for opciones}}<div class="li"><div class="grow"><b>#{{:seq}} {{>ref}}</b><small>Total {{:~money(total)}} · diferencia {{:~money(dif)}}</small></div>
    <button class="btn sm {{if sel}}primary{{/if}}" data-pick="{{:id}}">{{if sel}}Vinculada{{else}}Elegir{{/if}}</button></div>
  {{else}}<p class="muted">No hay facturas disponibles.</p>{{/for}}
</div>
{{if actual}}<button class="btn danger" id="desv" style="margin-top:12px">Desvincular</button>{{/if}}
</script>


<!-- =================================================================
     8. RESUMEN DEL MES Y REGÍMENES
     ================================================================= -->
<!-- Datos: resumenMes(p) -->
<script type="text/x-jsrender" id="resumen-mes">
<div class="calc">
  <div class="row"><span class="lbl">Ingresos cobrados <small>({{:n}} factura(s), sin IVA{{if sinComplemento}}; {{:sinComplemento}} sin complemento{{/if}})</small></span><span>{{:~money(ingresos)}}</span></div>
  <div class="row"><span class="lbl">ISR retenido por clientes</span><span>{{:~money(isrRet)}}</span></div>
  <div class="row sep"><span class="lbl">IVA cobrado (16%)</span><span>{{:~money(ivaCobrado)}}</span></div>
  <div class="row"><span class="lbl">− IVA retenido</span><span>{{:~money(ivaRet)}}</span></div>
  <div class="row"><span class="lbl">− IVA acreditable <small>({{:nGastos}} gasto(s), subtotal {{:~money(gastosSub)}})</small></span><span>{{:~money(ivaAcred)}}</span></div>
  <div class="row total"><span>{{if aFavor}}IVA a favor{{else}}IVA a cargo{{/if}}</span><span>{{:~money(aFavor || ivaCargo)}}</span></div>
</div>
{{if facturasTxt}}<p class="hint">Facturas: {{>facturasTxt}}</p>{{/if}}
<p class="hint">Estimación de apoyo con tus facturas cobradas en el mes (fecha del depósito o del complemento) y tus gastos del mes. Confírmala antes de presentar.</p>
</script>

<!-- Modal de regímenes. Datos: { actual, nomina:[], promedio } -->
<script type="text/x-jsrender" id="regimenes">
<div class="readbox">
  <div class="ic">{{:~icon('scale')}}</div>
  <div><b>Tu situación según tus documentos</b>
    <ul>
      <li>Facturas con el régimen <b>{{>actual}}</b>.</li>
      <li>La UNAM te paga honorarios <b>NO ASIMILADOS</b>: es servicio profesional independiente, no salario.</li>
      {{if nomina.length}}<li>También recibes <b>nómina</b> de: {{>nomina.join(', ')}} → régimen <b>605 Sueldos y salarios</b>.</li>{{/if}}
    </ul>
  </div>
</div>

<div class="reg-grid">
  <section class="reg-card">
    <header><span class="code">612</span><h3>Actividades Empresariales y Profesionales</h3></header>
    <ul>
      <li><b>Para:</b> servicios profesionales independientes (honorarios), sin límite de ingresos.</li>
      <li><b>ISR mensual:</b> ingresos cobrados − gastos deducibles, con la tarifa progresiva (hasta 35%).</li>
      <li><b>Retención de la UNAM:</b> ISR 10% e IVA 2/3 (10.67%).</li>
      <li><b>Deducciones:</b> sí, gastos estrictamente indispensables con CFDI y pagados (equipo, internet, etc.).</li>
      <li><b>Mensual:</b> ISR, IVA y DIOT; contabilidad electrónica.</li>
      <li><b>Anual:</b> obligatoria; permite deducciones personales (médicos, colegiaturas…).</li>
    </ul>
  </section>
  <section class="reg-card">
    <header><span class="code">626</span><h3>RESICO (Régimen Simplificado de Confianza)</h3></header>
    <ul>
      <li><b>Para:</b> ingresos del año hasta <b>$3.5 millones</b>; puede convivir con sueldos y salarios e intereses (sumados dentro del límite).</li>
      <li><b>ISR mensual:</b> 1% a 2.5% sobre lo cobrado sin IVA, <b>sin deducciones</b>; los pagos son definitivos.</li>
      <li><b>Retención de la UNAM:</b> ISR 1.25% e IVA 2/3.</li>
      <li><b>No pueden:</b> socios o accionistas de personas morales, entre otros casos.</li>
      <li><b>IVA:</b> igual que en 612 (mensual, con acreditamiento).</li>
      <li><b>Gastos:</b> no reducen el ISR; sí sirven para el IVA acreditable.</li>
    </ul>
  </section>
  <section class="reg-card">
    <header><span class="code">605</span><h3>Sueldos y Salarios</h3></header>
    <ul>
      <li><b>Para:</b> lo que te pagan por nómina (UNAM, SEGOB…).</li>
      <li><b>ISR:</b> lo retiene el patrón cada pago.</li>
      <li><b>Anual:</b> obligatoria si tuviste dos o más patrones a la vez, si ganaste más de $400,000, o si tienes otros ingresos (como tus honorarios).</li>
      <li>Se declara junto con 612 en la anual; en RESICO, el RESICO va aparte.</li>
    </ul>
  </section>
</div>

<h3 class="reg-sub">Comparador rápido (mensual)</h3>
<label class="f">Ingreso mensual por honorarios, sin IVA<input id="rgIng" type="number" step="0.01" inputmode="decimal" value="{{:promedio}}"></label>

</script>
