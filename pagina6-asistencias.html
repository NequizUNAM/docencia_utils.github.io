<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de Asistencia y Bitácora</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <style>
    body { background-color: #ffffff; color: #1a1a2e; display:flex; flex-direction:column; min-height:100vh; }
    .hero { background: linear-gradient(135deg, #001f5b, #1a1a2e); color: white; padding: 60px 20px; }
    .filtros-card { border: none; box-shadow: 0 2px 10px rgba(0,31,91,0.08); border-radius: .75rem; }
    #tablaParticipantes tbody tr.marcado-si { background-color: #eaf5ea; }
    #tablaParticipantes tbody tr.marcado-no { background-color: #fdecec; }
    .form-check-input:checked { background-color: #001f5b; border-color: #001f5b; }
    .btn-primary-navy { background-color: #001f5b; border-color: #001f5b; color:#fff; }
    .btn-primary-navy:hover { background-color: #001240; border-color:#001240; color:#fff; }
    .badge-sesion { background-color:#001f5b; }
    .thumb-preview { max-width: 120px; max-height: 120px; object-fit: cover; border-radius:.5rem; border:1px solid #dee2e6; }
    #estadoGuardado { min-height: 24px; }
  </style>
</head>
<body>
  <div id="header-container"></div>

  <main class="flex-grow-1 col-md-9 ms-md-auto col-lg-10 py-5 px-4">
    <div class="hero text-center rounded-3 mb-4">
      <h1 class="display-5 fw-bold">Registro de Asistencia</h1>
      <p class="lead mb-0">Selecciona grupo y sesión, marca asistencia y agrega bitácora por participante</p>
    </div>

    <div class="container">

      <!-- FILTROS -->
      <div class="card filtros-card p-3 mb-4">
        <div class="row g-3 align-items-end">
          <div class="col-md-5">
            <label for="selectGrupo" class="form-label fw-semibold">Grupo (group1)</label>
            <select id="selectGrupo" class="form-select">
              <option value="">Selecciona un grupo…</option>
            </select>
          </div>
          <div class="col-md-4">
            <label for="selectSesion" class="form-label fw-semibold">Sesión</label>
            <select id="selectSesion" class="form-select">
              <option value="Sesión1">Sesión 1</option>
              <option value="Sesión2">Sesión 2</option>
              <option value="Sesión3">Sesión 3</option>
              <option value="Sesión4">Sesión 4</option>
              <option value="Sesión5">Sesión 5</option>
              <option value="Sesión6">Sesión 6</option>
              <option value="Sesión7">Sesión 7</option>
              <option value="Sesión8">Sesión 8</option>
              <option value="Sesión9">Sesión 9</option>
              <option value="Sesión10">Sesión 10</option>
            </select>
          </div>
          <div class="col-md-3">
            <button id="btnCargar" class="btn btn-primary-navy w-100">
              <i class="bi bi-arrow-repeat"></i> Cargar participantes
            </button>
          </div>
        </div>
        <div id="estadoGuardado" class="small text-muted mt-2"></div>
      </div>

      <!-- TABLA PARTICIPANTES -->
      <div class="table-responsive">
        <table class="table table-hover align-middle bg-white" id="tablaParticipantes">
          <thead style="background-color:#001f5b; color:#fff;">
            <tr>
              <th>Folio</th>
              <th>Participante</th>
              <th class="text-center">Asistencia <span id="badgeSesionActual" class="badge badge-sesion"></span></th>
              <th class="text-center">Bitácora</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="4" class="text-center text-muted py-4">Selecciona un grupo y una sesión, luego "Cargar participantes".</td>
            </tr>
          </tbody>
        </table>
      </div>

    </div>
  </main>

  <!-- MODAL BITÁCORA -->
  <div class="modal fade" id="modalBitacora" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header" style="background-color:#001f5b; color:#fff;">
          <h5 class="modal-title"><i class="bi bi-journal-text"></i> Bitácora de participante</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="logFolio">
          <input type="hidden" id="logGrupo">
          <p class="mb-3"><strong>Participante:</strong> <span id="logNombre">-</span></p>

          <div class="mb-3">
            <label for="logImagen" class="form-label">Imagen (opcional)</label>
            <input class="form-control" type="file" id="logImagen" accept="image/*">
            <div class="mt-2">
              <img id="logImagenPreview" class="thumb-preview d-none" alt="Vista previa">
            </div>
          </div>

          <div class="mb-3">
            <label for="logComentario" class="form-label">Comentario</label>
            <textarea class="form-control" id="logComentario" rows="3" placeholder="Escribe una observación…"></textarea>
          </div>

          <div id="logEstado" class="small"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" id="btnGuardarLog" class="btn btn-primary-navy">
            <i class="bi bi-cloud-upload"></i> Guardar registro
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="footer-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="js/app.js"></script>

  <script>
  /* =========================================================================
   * SCRIPT DE LA PÁGINA — Registro de Asistencia y Bitácora
   * Todo en un solo archivo (HTML + JS), como en el resto de páginas del
   * sitio (pagina1-formulario.html, pagina2-convertidor-drive.html, etc.)
   *
   * Este script consume el MISMO Web App de Apps Script (Code.gs) que ya
   * usan tus otras páginas: se agregaron ahí las acciones "listGrupos",
   * "listParticipantes", "updateAsistencia" y "addBitacoraAsistencia".
   * ========================================================================= */

  /* -----------------------------------------------------------------------
   * 1) VARIABLES GLOBALES DE URL — mantenimiento centralizado
   * ----------------------------------------------------------------------- */
  // URL de implementación del Web App de Apps Script (Code.gs). Reemplázala
  // cada vez que vuelvas a "Implementar > Nueva implementación".
  const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbygqhpJct88ZhbtH6tnfkPys3vgggJiVLyjufqJ-Pz9bSLcvM1ohYS4sVgAFe8Al3ed/exec"; // ej. https://script.google.com/macros/s/XXXXX/exec

  /* -----------------------------------------------------------------------
   * 2) MODEL — llamadas al Web App (GET para lectura, POST para escritura)
   * ----------------------------------------------------------------------- */

  /**
   * Ejecuta una acción de LECTURA contra el Web App (doGet), vía querystring.
   * @param {string} action Nombre de la acción (ej. "listGrupos")
   * @param {Object} [params] Parámetros adicionales de la URL
   * @return {Promise<Object>} Respuesta JSON del Web App
   */
  async function llamarWebAppGet(action, params = {}) {
    const query = new URLSearchParams({ action, ...params }).toString();
    const resp = await fetch(`${WEB_APP_URL}?${query}`);
    if (!resp.ok) throw new Error(`Error de red en ${action} (${resp.status})`);
    return resp.json();
  }

  /**
   * Ejecuta una acción de ESCRITURA contra el Web App (doPost).
   * Se usa "text/plain" como Content-Type para evitar el preflight OPTIONS,
   * que Apps Script no maneja de forma nativa.
   * @param {string} action Nombre de la acción (ej. "updateAsistencia")
   * @param {Object} payload Cuerpo adicional a enviar
   * @return {Promise<Object>} Respuesta JSON del Web App
   */
  async function llamarWebAppPost(action, payload = {}) {
    const resp = await fetch(WEB_APP_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action, ...payload })
    });
    if (!resp.ok) throw new Error(`Error de red en ${action} (${resp.status})`);
    return resp.json();
  }

  // Trae los grupos únicos (columna group1) desde la hoja Asistencias
  function fetchGrupos() {
    return llamarWebAppGet("listGrupos");
  }

  // Trae los participantes de un grupo específico
  function fetchParticipantesPorGrupo(grupo) {
    return llamarWebAppGet("listParticipantes", { grupo });
  }

  // Marca Sí/No en la columna de la sesión seleccionada para un Folio
  function actualizarAsistencia(folio, columnaSesion, valor) {
    return llamarWebAppPost("updateAsistencia", { folio, columnaSesion, valor });
  }

  // Convierte un File a base64 puro (sin el prefijo "data:...;base64,")
  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // Crea un renglón nuevo en Log_Asistencia (con imagen opcional)
  async function guardarLog({ folio, nombre, grupo, sesion, comentario, file }) {
    let base64Data = null, fileName = null, mimeType = null;
    if (file) {
      base64Data = await fileToBase64(file);
      fileName = `${Date.now()}_${file.name}`;
      mimeType = file.type;
    }
    return llamarWebAppPost("addBitacoraAsistencia", {
      folio, nombre, grupo, sesion, comentario, base64Data, fileName, mimeType
    });
  }

  /* -----------------------------------------------------------------------
   * 3) VIEW — render de tabla y utilidades de UI
   * ----------------------------------------------------------------------- */
  function renderGrupos(grupos) {
    const $sel = $("#selectGrupo");
    $sel.find("option:not(:first)").remove();
    (grupos || []).forEach(g => $sel.append(`<option value="${g}">${g}</option>`));
  }

  function renderParticipantes(participantes, columnaSesion) {
    const $tbody = $("#tablaParticipantes tbody");
    $("#badgeSesionActual").text(columnaSesion.replace("Sesión", "Sesión "));

    if (!participantes.length) {
      $tbody.html(`<tr><td colspan="4" class="text-center text-muted py-4">Sin participantes para este grupo.</td></tr>`);
      return;
    }

    const filas = participantes.map(p => {
      const val = (p[columnaSesion] || "").toString().trim().toLowerCase();
      const marcado = val === "sí" || val === "si";
      return `
        <tr data-folio="${p.Folio}" class="${marcado ? "marcado-si" : ""}">
          <td>${p.Folio}</td>
          <td>${p.firstname || ""} ${p.lastname || ""}</td>
          <td class="text-center">
            <input type="checkbox" class="form-check-input chk-asistencia" ${marcado ? "checked" : ""}>
          </td>
          <td class="text-center">
            <button class="btn btn-sm btn-outline-primary btn-bitacora"
                    data-folio="${p.Folio}"
                    data-nombre="${(p.firstname || "") + " " + (p.lastname || "")}"
                    data-grupo="${p.group1 || ""}">
              <i class="bi bi-journal-plus"></i>
            </button>
          </td>
        </tr>`;
    }).join("");

    $tbody.html(filas);
  }

  function mostrarEstado(selector, mensaje, tipo = "muted") {
    const clases = { muted: "text-muted", ok: "text-success", error: "text-danger" };
    $(selector).removeClass("text-muted text-success text-danger")
               .addClass(clases[tipo] || "text-muted")
               .text(mensaje);
  }

  /* -----------------------------------------------------------------------
   * 4) CONTROLLER — eventos
   * ----------------------------------------------------------------------- */
  $(async function () {
    try {
      const { grupos, error } = await fetchGrupos();
      if (error) throw new Error(error);
      renderGrupos(grupos);
    } catch (err) {
      console.error(err);
      mostrarEstado("#estadoGuardado", "No se pudieron cargar los grupos. Revisa la consola.", "error");
    }

    // Cargar participantes del grupo + sesión seleccionados
    $("#btnCargar").on("click", async function () {
      const grupo = $("#selectGrupo").val();
      const sesion = $("#selectSesion").val();
      if (!grupo) {
        mostrarEstado("#estadoGuardado", "Selecciona un grupo primero.", "error");
        return;
      }
      mostrarEstado("#estadoGuardado", "Cargando participantes…");
      try {
        const { participantes, error } = await fetchParticipantesPorGrupo(grupo);
        if (error) throw new Error(error);
        renderParticipantes(participantes, sesion);
        mostrarEstado("#estadoGuardado", `${participantes.length} participante(s) cargado(s).`, "ok");
      } catch (err) {
        console.error(err);
        mostrarEstado("#estadoGuardado", "Error al cargar participantes.", "error");
      }
    });

    // Evento CHANGE del checkbox: marca Sí/No en automático en la hoja
    $("#tablaParticipantes").on("change", ".chk-asistencia", async function () {
      const $chk = $(this);
      const $fila = $chk.closest("tr");
      const folio = $fila.data("folio");
      const columnaSesion = $("#selectSesion").val();
      const valor = $chk.is(":checked") ? "Sí" : "No";

      $chk.prop("disabled", true);
      try {
        const resp = await actualizarAsistencia(folio, columnaSesion, valor);
        if (resp.status !== "success") throw new Error(resp.message);
        $fila.toggleClass("marcado-si", valor === "Sí").toggleClass("marcado-no", valor === "No");
      } catch (err) {
        console.error(err);
        $chk.prop("checked", !$chk.is(":checked")); // revertir si falla
        alert("No se pudo guardar la asistencia. Intenta de nuevo.");
      } finally {
        $chk.prop("disabled", false);
      }
    });

    // Abrir modal de bitácora
    $("#tablaParticipantes").on("click", ".btn-bitacora", function () {
      const $btn = $(this);
      $("#logFolio").val($btn.data("folio"));
      $("#logGrupo").val($btn.data("grupo"));
      $("#logNombre").text($btn.data("nombre"));
      $("#logImagen").val("");
      $("#logImagenPreview").addClass("d-none").attr("src", "");
      $("#logComentario").val("");
      mostrarEstado("#logEstado", "");
      new bootstrap.Modal("#modalBitacora").show();
    });

    // Vista previa de imagen
    $("#logImagen").on("change", function () {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => $("#logImagenPreview").removeClass("d-none").attr("src", e.target.result);
      reader.readAsDataURL(file);
    });

    // Guardar bitácora (imagen opcional + comentario)
    $("#btnGuardarLog").on("click", async function () {
      const folio = $("#logFolio").val();
      const nombre = $("#logNombre").text();
      const grupo = $("#logGrupo").val();
      const sesion = $("#selectSesion").val();
      const comentario = $("#logComentario").val().trim();
      const file = $("#logImagen")[0].files[0];

      if (!comentario && !file) {
        mostrarEstado("#logEstado", "Agrega al menos un comentario o una imagen.", "error");
        return;
      }

      const $btn = $(this).prop("disabled", true);
      mostrarEstado("#logEstado", file ? "Subiendo imagen y guardando…" : "Guardando…");
      try {
        const resp = await guardarLog({ folio, nombre, grupo, sesion, comentario, file });
        if (resp.status !== "success") throw new Error(resp.message);
        mostrarEstado("#logEstado", "Registro guardado correctamente.", "ok");
        setTimeout(() => bootstrap.Modal.getInstance($("#modalBitacora")[0]).hide(), 800);
      } catch (err) {
        console.error(err);
        mostrarEstado("#logEstado", "Error al guardar el registro.", "error");
      } finally {
        $btn.prop("disabled", false);
      }
    });
  });
  </script>
</body>
</html>
